<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Sala de trajes espaciales · JPL</title>
<meta name="description" content="La línea del tiempo de los trajes espaciales en 3D: cada traje en su pedestal, pieza por pieza, con sus capas, sus datos reales y una simulación de cómo se presuriza.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Sala de museo: los trajes en fila sobre pedestales, ordenados por año. Panel a la derecha (abajo en el teléfono) con piezas, capas, datos e historia. */
:root{
  --void:#05070b; --panel:rgba(11,15,24,.93); --line:#1f2840; --line2:#2e3b5a;
  --ink:#eceef4; --dim:#9aa3b8; --faint:#5f6983; --acc:#ffb547; --blue:#5fb4ff; --red:#ff6a5c; --ok:#7ee2a8;
  --f-display:"Jost","Futura","Century Gothic",system-ui,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px); --pw:400px;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:14px}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;outline:none}
button{font-family:var(--f-body)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px)}
.top{position:fixed;top:calc(10px + var(--top));left:16px;right:calc(var(--pw) + 28px);display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:8;pointer-events:none}
.top>*{pointer-events:auto}
.back{color:var(--dim);text-decoration:none;font-size:12.5px;padding:8px 11px}
.back:hover{color:var(--ink)}
.title{padding:6px 13px}
.title .kick{font:500 10.5px var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.title h1{margin:1px 0 0;font:700 17px var(--f-display)}
.count{margin-left:auto;padding:7px 11px;font:500 12px var(--f-data);color:var(--dim)}
.count b{color:var(--ok);font-weight:500}

/* fila de trajes (abajo) */
.line{position:fixed;left:16px;right:calc(var(--pw) + 28px);bottom:calc(12px + var(--bot));z-index:8;display:flex;gap:6px;overflow-x:auto;padding:7px;scrollbar-width:thin}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 10px;border-radius:9px;border:1px solid var(--line2);background:transparent;color:var(--ink);cursor:pointer;text-align:left}
.chip small{font:500 10.5px var(--f-data);color:var(--dim)}
.chip b{font:600 13px var(--f-display);white-space:nowrap}
.chip.soon{border-style:dashed;color:var(--faint)} .chip.soon b{color:var(--faint);font-weight:500}
.chip[aria-current=true]{border-color:var(--acc);background:rgba(255,181,71,.13)}
.chip:hover{border-color:var(--acc)}

/* panel de la derecha */
.side{position:fixed;top:calc(10px + var(--top));right:16px;bottom:calc(12px + var(--bot));width:var(--pw);z-index:9;display:flex;flex-direction:column;overflow:hidden}
.sh{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh .k{font:500 10.5px var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.sh h2{margin:3px 0 4px;font:700 22px/1.15 var(--f-display)}
.sh p{margin:0;color:var(--dim);font-size:13.5px;line-height:1.5}
.acts{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.tb{background:transparent;border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:12.5px;cursor:pointer}
.tb:hover{border-color:var(--acc)}
.tb[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#1a1100}
.tb.go{border-color:var(--acc);color:var(--acc)}
.tabs{display:flex;gap:2px;padding:8px 12px 0}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:8px 4px;font:600 12.5px var(--f-display);letter-spacing:.04em;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--acc)}
.body{flex:1;overflow-y:auto;padding:12px 16px 18px;line-height:1.55;font-size:13.5px}
.body p{margin:0 0 10px;color:#cfd4e0}
.body h4{margin:14px 0 6px;font:600 14px var(--f-display);color:var(--ink)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li button{width:100%;display:grid;grid-template-columns:26px 1fr;gap:2px 10px;align-items:start;text-align:left;background:transparent;border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--ink);cursor:pointer}
.plist li button:hover{border-color:var(--line2)}
.plist li button[aria-current=true]{border-color:var(--acc);background:rgba(255,181,71,.08)}
.plist .n{grid-row:span 2;width:22px;height:22px;border-radius:50%;background:#1b2436;border:1px solid var(--line2);display:grid;place-items:center;font:600 11px var(--f-data)}
.plist li button[aria-current=true] .n{background:var(--acc);color:#1a1100;border-color:var(--acc)}
.plist b{font:600 13.5px var(--f-display)}
.plist .d{grid-column:2;color:#c8cedb;font-size:13px}
.plist li button:not([aria-current=true]) .d{display:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0 0 12px}
.kv dt{color:var(--dim)} .kv dd{margin:0}
.src{margin:14px 0 0;padding:10px 0 0;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
.src a{color:var(--blue);word-break:break-word}
.src ul{margin:4px 0 0;padding-left:16px}
.warn{font-size:12px;color:var(--dim);border-left:2px solid var(--line2);padding-left:10px;margin:8px 0 10px}
.layers{display:flex;flex-direction:column;gap:3px;margin:6px 0 10px}
.ly{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:7px;background:#0f1522;font-size:12.5px}
.ly i{width:14px;height:14px;border-radius:3px;display:block}
.ly small{font:500 11px var(--f-data);color:var(--dim)}
.ly.out{outline:1px solid var(--line2)}

/* etiquetas de las piezas sobre el 3D */
#tags{position:fixed;inset:0;pointer-events:none;z-index:6}
.tag{position:absolute;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:1.5px solid #fff;background:rgba(10,14,22,.78);color:#fff;font:600 11px var(--f-data);display:grid;place-items:center;cursor:pointer;pointer-events:auto;transition:background .15s,transform .15s;box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.tag:hover,.tag.on{background:var(--acc);color:#1a1100;border-color:var(--acc);transform:scale(1.12)}
.tag.back{opacity:.35}

/* manómetro */
.gauge{position:fixed;left:16px;top:calc(70px + var(--top));z-index:8;padding:10px 12px;width:230px}
.gauge .k{font:500 10.5px var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.gauge .v{font:600 26px var(--f-data);margin:2px 0}
.gauge .v small{display:block;font-size:12px;font-weight:400;color:var(--dim)}
.gauge .bar{height:6px;border-radius:3px;background:#1b2436;overflow:hidden}
.gauge .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--acc))}
.gauge .log{margin:8px 0 0;font-size:12.5px;color:#cfd4e0;line-height:1.45}

.soonbox{border:1px dashed var(--line2);border-radius:10px;padding:12px;color:var(--dim)}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--bot));z-index:7;padding:7px 12px;font-size:12.5px;color:var(--dim);margin-left:calc(var(--pw) / -2 - 6px);white-space:nowrap}

@media (max-width:860px){
  :root{--pw:0px}
  .top{right:16px}
  .count{display:none}
  .side{top:auto;left:0;right:0;bottom:0;width:auto;height:46vh;border-radius:14px 14px 0 0;border-bottom:0}
  .side.min{height:auto}
  .side.min .acts,.side.min .tabs,.side.min .body{display:none}
  .line{left:0;right:0;bottom:calc(46vh + 6px);padding:6px 16px;background:none;border:0;backdrop-filter:none}
  .side.min~.line{bottom:calc(var(--shh,92px) + 6px)}
  .hint{display:none}
  .gauge{width:190px;top:calc(62px + var(--top))}
  .sh{cursor:pointer}
  .sh h2{font-size:19px}
}
</style>
</head>
<body>
<canvas id="gl" aria-label="Sala 3D con los trajes espaciales (arrastra para girar, rueda o pellizco para acercar)"></canvas>
<div id="tags"></div>

<div class="top">
  <a class="back panel" href="../">← JPL · NASA</a>
  <div class="title panel"><div class="kick">Sala 01 · Línea del tiempo</div><h1>Trajes espaciales</h1></div>
  <div class="count panel" id="count"></div>
</div>

<div class="gauge panel" id="gauge" hidden aria-live="polite">
  <div class="k" id="gk">Presión del traje</div>
  <div class="v" id="gv">0,0 <small>psi</small></div>
  <div class="bar"><i id="gb"></i></div>
  <div class="log" id="glog"></div>
</div>

<aside class="side panel" id="side" aria-live="polite">
  <div class="sh" id="sh"><div class="k" id="sk"></div><h2 id="sn"></h2><p id="ss"></p></div>
  <div class="acts" id="acts"></div>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-t="partes" aria-selected="true">Piezas</button>
    <button role="tab" data-t="capas">Capas</button>
    <button role="tab" data-t="datos">Datos</button>
    <button role="tab" data-t="historia">Historia</button>
  </div>
  <div class="body" id="body"></div>
</aside>
<nav class="line panel" id="line" aria-label="Trajes por año"></nav>
<div class="hint panel" id="hint">Arrastra para girar · toca un número para ver qué es cada pieza</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $=id=>document.getElementById(id);
const V3=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const fmt=(x,d=1)=>x.toFixed(d).replace('.',',');

/* ================= RENDER: luz de estudio, tonos de cine, sombras suaves ================= */
const canvas=$('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x06080d);
scene.fog=new THREE.Fog(0x06080d,10,30);
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(32,1,0.05,80);
camera.position.set(0,2.2,9);
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true; controls.dampingFactor=.08;
controls.minDistance=.7; controls.maxDistance=11; controls.maxPolarAngle=Math.PI*.56;
controls.target.set(0,1.2,0);

scene.add(new THREE.HemisphereLight(0x9fb4d8,0x0b0d12,.35));
const key=new THREE.SpotLight(0xfff3e2,70,12,.42,.65,1.6);
key.castShadow=true; key.shadow.mapSize.set(2048,2048); key.shadow.bias=-.0002; key.shadow.normalBias=.02; key.shadow.camera.near=1; key.shadow.camera.far=12;
scene.add(key,key.target);
const rim=new THREE.SpotLight(0x9cc6ff,40,10,.5,.8,1.6); scene.add(rim,rim.target);
const fill=new THREE.PointLight(0xffe0c0,3,6,2); scene.add(fill);

/* ================= TEXTURAS: tejido (relieve de los hilos) y manchas de uso ================= */
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
// mapa de normales de un tejido: hilos que suben y bajan (tafetán). cells = hilos por lado de la textura
function weaveNormal(cells=14,strength=2.2,size=256){
  const H=new Float32Array(size*size), s=size/cells;
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const i=Math.floor(x/s), j=Math.floor(y/s), fx=(x%s)/s, fy=(y%s)/s;
    const horiz=(i+j)%2===0;
    const across=horiz?fy:fx, along=horiz?fx:fy;
    H[y*size+x]=Math.sin(across*Math.PI)*.8*(.65+.35*Math.sin(along*Math.PI));
  }
  const c=document.createElement('canvas'); c.width=c.height=size; const g=c.getContext('2d'); const img=g.createImageData(size,size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const h=(xx,yy)=>H[((yy+size)%size)*size+((xx+size)%size)];
    const dx=(h(x+1,y)-h(x-1,y))*strength, dy=(h(x,y+1)-h(x,y-1))*strength;
    const l=Math.hypot(dx,dy,1), k=(y*size+x)*4;
    img.data[k]=(-dx/l*.5+.5)*255; img.data[k+1]=(-dy/l*.5+.5)*255; img.data[k+2]=(1/l*.5+.5)*255; img.data[k+3]=255;
  }
  g.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=8; return t;
}
// color con manchas suaves de uso (los trajes reales no son blanco puro)
function grime(base,amount=.05,seed=3,size=256){
  const c=document.createElement('canvas'); c.width=c.height=size; const g=c.getContext('2d');
  g.fillStyle=base; g.fillRect(0,0,size,size);
  const r=rng(seed);
  for(let i=0;i<70;i++){ const x=r()*size,y=r()*size,rad=10+r()*55, d=r()<.5;
    const gr=g.createRadialGradient(x,y,0,x,y,rad); gr.addColorStop(0,d?`rgba(90,75,50,${amount*r()})`:`rgba(255,255,255,${amount*r()})`); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; for(const ox of[-size,0,size])for(const oy of[-size,0,size]) g.fillRect(x-rad+ox,y-rad+oy,rad*2,rad*2); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
const TX={ weave:weaveNormal(14,2.2), weaveFine:weaveNormal(22,1.6), metal:weaveNormal(26,3.2) };
const flagTex=(kind)=>{ const c=document.createElement('canvas'); c.width=190; c.height=100; const g=c.getContext('2d');
  if(kind==='us'){ for(let i=0;i<13;i++){ g.fillStyle=i%2?'#f4f1ea':'#b22234'; g.fillRect(0,i*100/13,190,100/13+.5); }
    g.fillStyle='#3c3b6e'; g.fillRect(0,0,76,54); g.fillStyle='#f4f1ea';
    for(let r=0;r<9;r++)for(let k=0;k<(r%2?5:6);k++){ g.beginPath(); g.arc(6+k*12.6+(r%2?6.3:0),4+r*5.6,1.5,0,7); g.fill(); } }
  else { const cs=['#f4f4f4','#0039a6','#d52b1e']; cs.forEach((cl,i)=>{ g.fillStyle=cl; g.fillRect(0,i*100/3,190,100/3+.5); }); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; };

/* materiales con física real: tela con brillo de fibra (sheen), metal, goma, plástico transparente */
function fabric(color,{rough=.86,sheen=.9,tint=0xffffff,nscale=.55,grimeAmt=.06,seed=1,weave=TX.weave}={}){
  return new THREE.MeshPhysicalMaterial({color:0xffffff,map:grime(color,grimeAmt,seed),roughness:rough,sheen,sheenRoughness:.55,sheenColor:new THREE.Color(tint),
    normalMap:weave,normalScale:new THREE.Vector2(nscale,nscale),envMapIntensity:.7,side:THREE.DoubleSide});
}
const M={
  beta: fabric('#ebe6da',{seed:4}),
  betaSoft: fabric('#e6e1d4',{seed:9,nscale:.4}),
  chromel: new THREE.MeshPhysicalMaterial({color:0xb9bdc4,metalness:.85,roughness:.42,normalMap:TX.metal,normalScale:new THREE.Vector2(.9,.9),envMapIntensity:1}),
  siliconeBlue: new THREE.MeshPhysicalMaterial({color:0x3f6fa8,roughness:.55,sheen:.3,clearcoat:.15}),
  soleBlue: new THREE.MeshPhysicalMaterial({color:0x2f5d95,roughness:.7}),
  alu: new THREE.MeshPhysicalMaterial({color:0xd6d9de,metalness:1,roughness:.22,envMapIntensity:1.1}),
  anoBlue: new THREE.MeshPhysicalMaterial({color:0x2a63c9,metalness:.9,roughness:.28,clearcoat:.6}),
  anoRed: new THREE.MeshPhysicalMaterial({color:0xc4262b,metalness:.85,roughness:.3,clearcoat:.6}),
  gold: new THREE.MeshPhysicalMaterial({color:0xe2b050,metalness:1,roughness:.06,envMapIntensity:1.4}),
  bubble: new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:.02,metalness:0,transmission:1,thickness:.006,ior:1.58,transparent:true,opacity:1,envMapIntensity:1.2,side:THREE.DoubleSide,depthWrite:false}),
  shellWhite: new THREE.MeshPhysicalMaterial({color:0xf0eee8,roughness:.38,clearcoat:.5,clearcoatRoughness:.3}),
  rubberDark: new THREE.MeshPhysicalMaterial({color:0x1b1d22,roughness:.6}),
  plasticGray: new THREE.MeshPhysicalMaterial({color:0x8c9097,roughness:.45,clearcoat:.3}),
  plasticDark: new THREE.MeshPhysicalMaterial({color:0x2c3036,roughness:.4,clearcoat:.4}),
  hoseBlue: new THREE.MeshPhysicalMaterial({color:0x7fa2c6,roughness:.5,clearcoat:.3,normalMap:TX.weaveFine,normalScale:new THREE.Vector2(.3,.3)}),
  hoseGray: new THREE.MeshPhysicalMaterial({color:0x9aa0a8,roughness:.55}),
  red: fabric('#b8302d',{seed:7,grimeAmt:.03}),
  snoopyW: fabric('#efece6',{seed:11,nscale:.3}),
  snoopyB: fabric('#4a3526',{seed:12,nscale:.3,grimeAmt:.02}),
  mannequin: new THREE.MeshPhysicalMaterial({color:0x2a2d33,roughness:.55,clearcoat:.2}),
  nylonW: fabric('#f1f1ee',{seed:21,rough:.8,sheen:1,nscale:.45,weave:TX.weaveFine}),
  webBlue: fabric('#3d5fa0',{seed:22,grimeAmt:.02,weave:TX.weaveFine,nscale:.8}),
  zipBlue: new THREE.MeshPhysicalMaterial({color:0x2850a8,roughness:.4,metalness:.3}),
  glove: fabric('#e9e9e6',{seed:23,nscale:.35}),
  boot: fabric('#6b7686',{seed:24,rough:.7,grimeAmt:.04}),
  visorClear: new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:.03,transmission:1,thickness:.004,ior:1.5,transparent:true,envMapIntensity:1.2,side:THREE.DoubleSide,depthWrite:false}),
  mirror: new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:1,roughness:.02}),
  dial: new THREE.MeshPhysicalMaterial({color:0xf2f2ee,roughness:.4}),
  orlanW: fabric('#eeede8',{seed:41,nscale:.45}),
  emuW: fabric('#f0eee9',{seed:51,nscale:.5}),
  blueStripe: fabric('#2f59b8',{seed:8,grimeAmt:.03}),
  aces: fabric('#e3520c',{seed:61,nscale:.55,grimeAmt:.05,tint:0xffc49a}),
  acesGlove: fabric('#d9601d',{seed:62,nscale:.35}),
  harness: fabric('#6f7066',{seed:63,weave:TX.weaveFine,nscale:.8,grimeAmt:.03}),
  lpu: fabric('#d7c34a',{seed:64,nscale:.4}),
  leather: new THREE.MeshPhysicalMaterial({color:0x17181a,roughness:.45,clearcoat:.35}),
  sxW: fabric('#f2f2f0',{seed:71,nscale:.35,weave:TX.weaveFine}),
  sxGray: fabric('#3b3e44',{seed:72,nscale:.5,grimeAmt:.02}),
  sxGlove: fabric('#2f3237',{seed:73,nscale:.4}),
  sxBoot: new THREE.MeshPhysicalMaterial({color:0xf0f0ee,roughness:.5,clearcoat:.3}),
  sxVisor: new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:.03,transmission:1,thickness:.004,ior:1.5,transparent:true,envMapIntensity:1.2,side:THREE.DoubleSide,depthWrite:false}),
  ghost: new THREE.MeshPhysicalMaterial({color:0x7f93b5,roughness:.25,metalness:.1,transparent:true,opacity:.16,depthWrite:false,side:THREE.DoubleSide}),
};

/* ================= GEOMETRÍA: piezas de tela «barridas» a lo largo de un eje =================
   Cada brazo, pierna o el torso es un tubo de sección elíptica que cambia de grosor, con arrugas de tela
   y fuelles en las articulaciones (las «convolutas» que dejaban doblar el traje inflado). */
function sweep(pts,{nT=56,nR=44,r,ref=V3(0,0,1),wr=.012,seed=1,ribs=[],uvs=.04}={}){
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>V3(...p)),false,'centripetal');
  const L=curve.getLength(), ra=rng(seed), ph=Array.from({length:8},()=>ra()*6.283);
  const pos=[],uv=[],idx=[];
  for(let i=0;i<=nT;i++){
    const t=i/nT, P=curve.getPointAt(t), T=curve.getTangentAt(t);
    const B=ref.clone().sub(T.clone().multiplyScalar(ref.dot(T))).normalize(), N=V3().crossVectors(T,B).normalize();
    const [rx,rz]=r(t); let rf=1;
    for(const [a,b,n,amp] of ribs) if(t>a&&t<b){ const s=(t-a)/(b-a); rf+=amp*Math.pow(Math.sin(s*Math.PI*n),2)*Math.sin(s*Math.PI); }
    const d=t*L;
    for(let j=0;j<=nR;j++){
      const a=j/nR*Math.PI*2, c=Math.cos(a), s=Math.sin(a);
      const w=1+wr*(Math.sin(a*3+d*9+ph[0])*Math.sin(d*23+ph[1])+.6*Math.sin(a*7-d*31+ph[2])*Math.sin(a*2+ph[3])+.35*Math.sin(d*61+a*5+ph[4]));
      const k=rf*w;
      pos.push(P.x+(N.x*c*rx+B.x*s*rz)*k, P.y+(N.y*c*rx+B.y*s*rz)*k, P.z+(N.z*c*rx+B.z*s*rz)*k);
      uv.push(j/nR*(Math.PI*(rx+rz))/uvs, d/uvs);
    }
  }
  for(let i=0;i<nT;i++)for(let j=0;j<nR;j++){ const a=i*(nR+1)+j,b=a+nR+1; idx.push(a,b,a+1,b,b+1,a+1); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}
const lerp=(a,b,t)=>a+(b-a)*t, smooth=t=>t*t*(3-2*t);
// perfil por tramos: [[t,valor],...]
const prof=(k)=>t=>{ for(let i=1;i<k.length;i++) if(t<=k[i][0]){ const s=(t-k[i-1][0])/(k[i][0]-k[i-1][0]); return lerp(k[i-1][1],k[i][1],smooth(s)); } return k[k.length-1][1]; };
function mesh(geo,mat,parent,{x=0,y=0,z=0,rx=0,ry=0,rz=0,cast=true}={}){ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.rotation.set(rx,ry,rz); m.castShadow=cast; m.receiveShadow=true; parent.add(m); return m; }
const tube=(pts,r,seg=40)=>new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p=>V3(...p))),seg,r,12,false);
// manguera corrugada (como las del Sokol)
function corrugated(pts,r,mat,parent){ const c=new THREE.CatmullRomCurve3(pts.map(p=>V3(...p))); const L=c.getLength(); const g=new THREE.TubeGeometry(c,Math.round(L/.008),r,14,false);
  const p=g.attributes.position, n=g.attributes.normal, segs=g.parameters.tubularSegments;
  for(let i=0;i<p.count;i++){ const ring=Math.floor(i/15), k=1+.16*Math.abs(Math.sin(ring/segs*L/.012*Math.PI)); /* anillos cada 1,2 cm */
    const cx=p.getX(i)-n.getX(i)*r, cy=p.getY(i)-n.getY(i)*r, cz=p.getZ(i)-n.getZ(i)*r; p.setXYZ(i,cx+n.getX(i)*r*k,cy+n.getY(i)*r*k,cz+n.getZ(i)*r*k); }
  g.computeVertexNormals(); return mesh(g,mat,parent); }

/* ================= EL CUERPO BASE (maniquí con traje) =================
   Medidas en metros; mira hacia +z. Su izquierda es +x. */
function body(o){
  const g=new THREE.Group(); const P={}; const inflate=[];
  const W=o.bulk||1, mat=o.mat;
  // torso
  const torso=mesh(sweep([[0,.86,0],[0,1.05,.005],[0,1.3,.012],[0,1.5,0],[0,1.57,0]],{seed:o.seed,wr:o.wr??.012,
    r:t=>[prof([[0,.12],[.12,.19],[.3,.18],[.6,.215],[.82,.22],[1,.12]])(t)*W, prof([[0,.1],[.12,.135],[.35,.13],[.6,.15],[.85,.14],[1,.11]])(t)*W]}),mat,g);
  inflate.push(torso); P.torso=torso;
  // hombros
  for(const s of[-1,1]){ const sh=mesh(new THREE.SphereGeometry(.098*W,32,20),mat,g,{x:s*.215*W,y:1.45,z:0}); sh.scale.set(1,.9,1.05); sh.userData.sz=1.05; inflate.push(sh); }
  // piernas (pivote en la cadera)
  P.legs=[];
  for(const s of[-1,1]){ const lg=new THREE.Group(); lg.position.set(s*.112*W,.98,0); g.add(lg);
    const m=mesh(sweep([[0,.04,0],[s*.008,-.2,.012],[s*.012,-.46,.03],[s*.018,-.7,.01],[s*.022,-.88,0]],{seed:o.seed+s*3,wr:o.wr??.014,ribs:o.kneeRibs||[],
      r:t=>{ const v=prof([[0,.11],[.25,.102],[.5,.088],[.56,.09],[.75,.08],[1,.07]])(t)*W; return [v,v*1.05]; }}),mat,lg);
    inflate.push(m); P.legs.push(lg); }
  // brazos (pivote en el hombro, cuelgan un poco separados)
  P.arms=[]; P.wrists=[];
  for(const s of[-1,1]){ const ag=new THREE.Group(); ag.position.set(s*.25*W,1.45,0); ag.rotation.z=s*.16; g.add(ag);
    const pts=[[0,.02,0],[s*.008,-.14,.005],[s*.01,-.29,.02],[s*.005,-.44,.06],[0,-.56,.085]];
    const m=mesh(sweep(pts,{seed:o.seed+s*7,wr:o.wr??.014,ribs:o.elbowRibs||[],ref:V3(1,0,0),
      r:t=>{ const v=prof([[0,.085],[.45,.07],[.55,.072],[1,.056]])(t)*W; return [v*1.02,v]; }}),mat,ag);
    inflate.push(m);
    const wr=new THREE.Group(); wr.position.set(0,-.56,.085); wr.rotation.x=-.18; ag.add(wr);
    P.arms.push(ag); P.wrists.push(wr); }
  // cuello
  P.neck=new THREE.Group(); P.neck.position.set(0,1.56,0); g.add(P.neck);
  return {g,P,inflate};
}
// mano con guante: palma hacia el cuerpo, dedos hacia abajo
function hand(wr,s,{shell,tips,ring,cuff}){
  const h=new THREE.Group(); wr.add(h);
  const ringM=mesh(new THREE.CylinderGeometry(.063,.063,.026,40),ring,h,{y:.0});
  mesh(new THREE.TorusGeometry(.063,.006,10,40),M.alu,h,{y:-.014,rx:Math.PI/2});
  const c=mesh(new THREE.CylinderGeometry(.058,.05,.075,32,1,true),cuff||shell,h,{y:-.05});
  const palm=mesh(new RoundedBoxGeometry(.05,.1,.095,4,.022),shell,h,{y:-.13,z:.005});
  const parts=[ringM,c,palm];
  for(let i=0;i<4;i++){ const f=mesh(new THREE.CapsuleGeometry(.0125,.045,6,12),shell,h,{y:-.205+Math.abs(i-1.5)*.006,z:-.033+i*.022,rz:-s*.25}); f.position.x=s*-.004;
    const tp=mesh(new THREE.SphereGeometry(.0135,14,10),tips||shell,h,{y:f.position.y-.033,z:f.position.z}); tp.scale.set(1,1.25,1); tp.position.x=f.position.x-s*.008; parts.push(f,tp); }
  const th=mesh(new THREE.CapsuleGeometry(.014,.04,6,12),shell,h,{x:-s*.016,y:-.12,z:.06,rx:.6}); parts.push(th);
  if(tips){ const tt=mesh(new THREE.SphereGeometry(.015,14,10),tips,h,{x:-s*.018,y:-.15,z:.085}); parts.push(tt); }
  return {h,parts,ring:ringM};
}

    harness.push(mesh(tube([[s*.07,.92,.13],[s*.13,.82,.13],[s*.2,.8,.05],[s*.2,.82,-.1]],.012,20),M.harness,g));
    harness.push(mesh(new RoundedBoxGeometry(.05,.035,.02,1,.005),M.alu,g,{x:s*.1,y:1.3,z:.165})); }
  harness.push(mesh(tube([[-.11,1.2,.16],[0,1.22,.17],[.11,1.2,.16]],.012,16),M.harness,g));
  add('arnes',harness,g,V3(-.11,1.2,.2));
  // chalecos salvavidas (LPU) bajo los brazos
  const lpu=[]; for(const s of[-1,1]) lpu.push(mesh(new RoundedBoxGeometry(.08,.2,.14,3,.03),M.lpu,g,{x:s*.205,y:1.2,z:.0}));
  add('salvavidas',lpu,g,V3(.24,1.22,.02));
  // mochila del paracaídas (en el transbordador iba en el asiento y servía de respaldo)
  const chute=mesh(new RoundedBoxGeometry(.42,.56,.2,5,.05),M.harness,g,{y:1.22,z:-.24});
  const kit=mesh(new RoundedBoxGeometry(.38,.14,.16,3,.03),M.lpu,g,{y:.9,z:-.22});
  add('paracaidas',[chute],g,V3(.2,1.35,-.3));
  add('balsa',[kit],g,V3(-.2,.9,-.26));
  // conexión de oxígeno en el muslo izquierdo
  const ox=mesh(new THREE.CylinderGeometry(.03,.03,.05,24),M.alu,P.legs[1],{x:.06,y:-.12,z:.1,rx:Math.PI/2});
  const oxh=mesh(tube([[.06,-.12,.13],[.12,-.2,.16],[.14,-.36,.12]],.014,20),M.hoseGray,P.legs[1]);
  add('oxigeno',[ox,oxh],P.legs[1],V3(.08,-.1,.14));
  // bolsillos de los hombros con barras de luz
  const pk=[]; for(const ag of P.arms){ pk.push(mesh(new RoundedBoxGeometry(.06,.12,.035,2,.01),M.aces,ag,{x:ag.position.x>0?.07:-.07,y:-.13,z:.04})); }

  P.wrists.forEach((wr,i)=>{ const s=i?1:-1; const hh=hand(wr,s,{shell:M.acesGlove,ring:M.plasticDark}); gl.push(...hh.parts.filter(p=>p!==hh.ring)); rings.push(hh.ring); });

  P.legs.forEach((lg,i)=>{ const s=i?1:-1; const b=new THREE.Group(); b.position.set(s*.02,-.86,.02); lg.add(b);
    boots.push(mesh(new RoundedBoxGeometry(.11,.12,.27,4,.04),M.leather,b,{y:-.05,z:.04}));
    boots.push(mesh(new THREE.CylinderGeometry(.07,.075,.2,28),M.leather,b,{y:.07}));

  add('botas',boots,P.legs[0],V3(-.03,-.9,.2));

  add('bandera',[flag],P.arms[1],V3(.1,-.2,.02));
  return {g,P,parts,inflate,anim:{visorPivot:vp},order:['casco','visor','cuello','cable','arnes','salvavidas','paracaidas','balsa','oxigeno','bolsillos','nomex','guantes','bandera','botas']};
}

/* ================= TRAJE 6: SPACEX (cápsula Dragon) ================= */
function buildSpaceX(){
  const {g,P,inflate}=body({mat:M.sxW,seed:71,bulk:.9,wr:.012});
  const parts={}; const add=(k,meshes,anchorObj,anchorPos)=>{ parts[k]={meshes:[].concat(meshes),obj:anchorObj,pos:anchorPos}; };
  add('capas',[P.torso],g,V3(.1,1.05,.13));
  // paneles grises a los lados del torso y en los brazos
  const panels=[];
  for(const s of[-1,1]) panels.push(mesh(new RoundedBoxGeometry(.03,.36,.2,3,.012),M.sxGray,g,{x:s*.168,y:1.22,z:0}));
  for(const ag of P.arms) panels.push(mesh(sweep([[0,-.02,0],[0,-.2,.01]],{nT:6,wr:0,r:()=>[.08,.077],ref:V3(1,0,0)}),M.sxGray,ag));
  add('paneles',panels,g,V3(.2,1.3,.05));
  // casco impreso en 3D con visor que sube
  const ring=mesh(new THREE.CylinderGeometry(.125,.13,.05,48),M.sxGray,P.neck,{y:0});
  const head=new THREE.Group(); head.position.y=.16; P.neck.add(head);
  const man=mesh(new THREE.SphereGeometry(.095,32,24),M.mannequin,head,{y:-.005}); man.scale.set(.9,1.12,1);
  const shell=mesh(new THREE.SphereGeometry(.16,56,36,Math.PI*1.02,Math.PI*.96,0,Math.PI*.86),M.shellWhite,P.neck,{y:.15}); shell.scale.set(1,1.04,1.08);
  const chin=mesh(new THREE.SphereGeometry(.161,56,12,Math.PI*.12,Math.PI*.76,Math.PI*.66,Math.PI*.2),M.sxGray,P.neck,{y:.15}); chin.scale.set(1,1.04,1.08);
  const crown=mesh(new THREE.SphereGeometry(.161,56,16,0,Math.PI*2,0,Math.PI*.2),M.shellWhite,P.neck,{y:.15}); crown.scale.set(1,1.04,1.08);
  const vp=new THREE.Group(); vp.position.y=.15; P.neck.add(vp);
  const visor=mesh(new THREE.SphereGeometry(.164,56,30,Math.PI*.12,Math.PI*.76,Math.PI*.2,Math.PI*.46),M.sxVisor,vp,{cast:false}); visor.scale.set(1,1.04,1.08);
  const visorCu=mesh(visor.geometry,new THREE.MeshPhysicalMaterial({color:0xd08a55,metalness:1,roughness:.08,envMapIntensity:1.3}),vp,{cast:false}); visorCu.scale.copy(visor.scale); visorCu.visible=false;
  const hinge=[]; for(const s of[-1,1]) hinge.push(mesh(new THREE.CylinderGeometry(.03,.03,.03,24),M.sxGray,vp,{x:s*.162,rz:Math.PI/2}));
  add('casco',[shell,crown,chin,ring],P.neck,V3(-.14,.24,.06));
  add('visor',[visor,visorCu,...hinge],P.neck,V3(.05,.2,.18));
  // versión EVA (Polaris Dawn): cámara del casco y pantalla HUD
  const camE=mesh(new RoundedBoxGeometry(.04,.04,.06,2,.008),M.plasticDark,P.neck,{x:-.17,y:.24,z:.06});
  const hud=mesh(new THREE.PlaneGeometry(.06,.025),new THREE.MeshBasicMaterial({color:0x7ee2a8,transparent:true,opacity:.75}),head,{x:.04,y:.04,z:.11,ry:-.2,cast:false});
  const evaBits=[camE,hud]; evaBits.forEach(m=>m.visible=false);
  add('eva',evaBits,P.neck,V3(-.18,.27,.08));
  // umbilical único en el muslo derecho, hacia el asiento
  const umb=mesh(new RoundedBoxGeometry(.09,.07,.05,2,.012),M.sxGray,P.legs[0],{x:-.055,y:-.14,z:.1});
  const umbH=mesh(tube([[-.06,-.14,.13],[-.1,-.22,.2],[-.14,-.42,.22],[-.2,-.6,.18]],.016,24),M.sxW,P.legs[0]);
  add('umbilical',[umb,umbH],P.legs[0],V3(-.07,-.12,.14));
  // cierre frontal y correas
  const zip=mesh(tube([[0,1.52,.135],[0,1.3,.158],[0,1.05,.14]],.004,20),M.sxGray,g);
  add('cierre',[zip],g,V3(0,1.42,.17));
  // guantes táctiles y botas con guía en el talón
  const gl=[], rings=[];
  P.wrists.forEach((wr,i)=>{ const s=i?1:-1; const hh=hand(wr,s,{shell:M.sxGlove,tips:M.sxGray,ring:M.sxGray}); gl.push(...hh.parts.filter(p=>p!==hh.ring)); rings.push(hh.ring); });
  add('guantes',[...gl,...rings],P.wrists[0],V3(0,-.14,.06));
  const boots=[];
  P.legs.forEach((lg,i)=>{ const s=i?1:-1; const b=new THREE.Group(); b.position.set(s*.02,-.86,.02); lg.add(b);
    boots.push(mesh(new RoundedBoxGeometry(.1,.11,.26,4,.04),M.sxBoot,b,{y:-.05,z:.035}));
    boots.push(mesh(new THREE.CylinderGeometry(.066,.07,.24,28),M.sxBoot,b,{y:.08}));
    boots.push(mesh(new RoundedBoxGeometry(.03,.04,.03,1,.006),M.alu,b,{y:-.07,z:-.1})); });
  add('botas',boots,P.legs[0],V3(-.03,-.9,.2));
  const flag=mesh(new THREE.PlaneGeometry(.09,.048),new THREE.MeshPhysicalMaterial({map:flagTex('us'),roughness:.8,sheen:.6}),P.arms[1],{x:.083,y:-.1,z:.01,ry:Math.PI/2-.1});
  add('bandera',[flag],P.arms[1],V3(.09,-.08,.01));
  return {g,P,parts,inflate,anim:{visorPivot:vp,eva:evaBits,visorMesh:visor,visorCu},order:['casco','visor','paneles','cierre','umbilical','guantes','capas','bandera','botas','eva']};
}

/* ================= FANTASMAS: los trajes que vendrán en los próximos pares ================= */
function buildGhost(o){
  const {g,P}=body({mat:M.ghost,seed:o.seed||50,bulk:o.bulk||1,wr:.008});
  const gm=M.ghost.clone(); gm.color.set(o.tint||0x7f93b5); g.traverse(m=>{ if(m.isMesh){ m.material=gm; m.castShadow=false; } });
  mesh(new THREE.SphereGeometry(o.helm||.17,32,20),gm,P.neck,{y:.15,cast:false});
  if(o.pack) mesh(new RoundedBoxGeometry(.46,.56,.22,4,.04),gm,g,{y:1.26,z:-.27,cast:false});
  P.wrists.forEach(wr=>mesh(new RoundedBoxGeometry(.05,.13,.09,3,.02),gm,wr,{y:-.12,cast:false}));
  P.legs.forEach(lg=>mesh(new RoundedBoxGeometry(.13,.12,.28,3,.04),gm,lg,{y:-.92,z:.05,cast:false}));
  return {g,P,parts:{},inflate:[],anim:{},order:[]};
}

   itmg:['Cubierta exterior ITMG (beta cloth)','La parte blanca que se ve es la cubierta térmica y contra micrometeoritos: 13 capas. Por fuera es <b>beta cloth</b>, una tela de fibra de vidrio cubierta de teflón que no arde. Se eligió después del incendio del Apollo 1 (enero de 1967), en el que murieron tres astronautas durante una prueba en la plataforma. Debajo van capas de Mylar y Kapton aluminizados, como espejos, separadas por tela de Dacron para que el calor no pase de una a otra.'],

  data:[['Fabricante','ILC (International Latex Corporation), Dover, Delaware; contratista Hamilton Standard'],['Usado en','A7L: Apollo 7 al 14 · A7LB: Apollo 15 al 17, Skylab y Apollo‑Soyuz'],['Masa','34,5 kg el traje de caminata; ~91 kg con la mochila PLSS y la OPS (en la Luna se siente como ~15 kg)'],['Presión','3,7–3,8 psi (≈ 26 kPa) de oxígeno: una cuarta parte de la presión del aire al nivel del mar'],['Capas','~21'],['Caminata máxima','4 h (Apollo 11–14) · 8 h (Apollo 15–17)'],['Costo','~100 000 USD de la época por traje (más de 670 000 USD de hoy)'],['Fabricados','al menos 105 trajes A7L']],
  hist:`<p>Para el traje lunar, la NASA eligió a ILC, una empresa de Delaware que hacía ropa interior y fajas de la marca Playtex. Sus costureras sabían coser telas elásticas con una precisión de menos de un milímetro, y eso era justo lo que hacía falta: una costura torcida y el traje tenía una fuga.</p>

   botas:['Botas','Las botas del traje son blandas y se ponen aparte, para poder caminar hasta la nave.'],
  },
  layers:[['#d9d6cc','Ropa interior','algodón'],['#55524c','Capa de presión','tela engomada de policaprolactama (capron)'],['#f3f3f0','Capa exterior','lona blanca de nailon']],
  layersNote:'Solo dos capas, porque nunca sale al espacio: no necesita protección contra el Sol ni los micrometeoritos.',
  data:[['Fabricante','NPP Zvezda, cerca de Moscú'],['Usado en','Todas las Soyuz desde la Soyuz 12 (1973); el KV‑2 desde la Soyuz T‑2 (1980)'],['Para qué','Despegue, acoplamiento y regreso; solo dentro de la nave'],['Masa','~10 kg'],['Autonomía','~2 horas si la cápsula queda en vacío; luego hay que aterrizar'],['Presión','~400 hPa sobre la cabina (≈ 0,4 atm) · dato no oficial'],['Capas','2'],['Hecho a medida','sí, cada uno para una persona']],
  hist:`<p>A mediados de los años 60 la Unión Soviética dejó de usar trajes en sus cápsulas para que cupieran tres cosmonautas. El 30 de junio de 1971, al regresar de la primera estación espacial, la Salyut 1, una válvula de la Soyuz 11 se abrió antes de tiempo y el aire se escapó. Gueorgui Dobrovolski, Vladislav Vólkov y Víktor Patsáyev, sin trajes, no sobrevivieron.</p>
   <p>La fábrica Zvezda tenía trajes para pilotos de aviones a gran altura. Los adaptó en menos de un año: así nació el Sokol‑K, que voló por primera vez en la Soyuz 12, en septiembre de 1973. Desde entonces nadie sube a una Soyuz sin él. A finales de los 70 se mejoró como Sokol KV‑2, el que se usa hasta hoy.</p>
   <p>Antes de cada despegue, en Baikonur, cada cosmonauta se pone su traje y lo inflan a más presión de la normal para buscar fugas. Lo puedes simular con el botón <b>Prueba de fugas</b>. El primer turista espacial, Dennis Tito, voló con uno en 2001 y lo donó al Smithsonian.</p>`,
  src:[['ESA · Sokol so cool','https://www.esa.int/ESA_Multimedia/Images/2017/07/Sokol_so_cool'],['Science Museum (Londres) · El traje de Helen Sharman','https://blog.sciencemuseum.org.uk/helen-sharmans-spacesuit/'],['National Space Centre · Sokol KV‑2','https://www.spacecentre.co.uk/collections/categories/spacesuits-and-clothing/sokol-kv-2-rescue-spacesuit/'],['Smithsonian NASM · Sokol de Dennis Tito','https://airandspace.si.edu/es/collection-objects/pressure-suit-sokol-kv-2-dennis-tito/nasm_A20030122000'],['Resumen técnico con referencias (Wikipedia)','https://en.wikipedia.org/wiki/Sokol_space_suit']]},
 {id:'orlan',name:'Orlan‑MKS',year:1977,build:buildOrlan,
  kick:'1977–hoy · NPP Zvezda (Rusia) · caminatas espaciales',
  sum:'El traje ruso para salir de la estación. Su gran truco: no se «viste», se entra en él. La mochila es una puerta en la espalda; el cosmonauta se mete por ahí, cierra la puerta con una palanca y queda sellado, normalmente sin ayuda de nadie. El modelo actual es el Orlan‑MKS. «Orlan» significa «águila marina».',
  parts:{
   casco:['Casco integrado','El casco no se quita: está unido al torso rígido. Por eso hay que entrar por la espalda. Es más grande que la cabeza, así que el cosmonauta mira por la ventana sin que el casco se mueva.'],
   ventana:['Ventana frontal y ventanita superior','Una ventana grande al frente y otra pequeña arriba, para ver lo que hay sobre la cabeza mientras trepa por los pasamanos de la estación.'],
   filtro:['Filtro solar dorado','Una visera que se baja delante de la ventana cuando da el Sol directo, como unas gafas de sol muy fuertes.'],
   luces:['Luces del casco','En la órbita de la estación hay noche cada 45 minutos. Las luces a los lados del casco permiten seguir trabajando a oscuras. Prueba el botón <b>Luces</b>.'],
   panel:['Panel de control del pecho','Para manejar el traje: oxígeno, ventilación, radio y temperatura. El Orlan‑MKS trae una computadora y una pantalla a color, y regula la temperatura solo, sin que el cosmonauta tenga que girar perillas.'],
   torso:['Torso rígido de aluminio','Una carcasa de aluminio, cubierta de tela blanca, que es la «espalda» del traje. Como es rígida, el traje es de talla única: lo que cambia es el largo de brazos y piernas.'],
   mochila:['Mochila-puerta de soporte vital','Lleva el oxígeno, el filtro que atrapa el CO₂, el agua de enfriamiento, la radio y las baterías. Es a la vez la puerta: se abre hacia un costado con bisagra. Prueba el botón <b>Entrar por la espalda</b>.'],
   entrada:['La abertura de entrada','Por este hueco entran primero las piernas, luego los brazos y la cabeza. Después la mochila se cierra y una palanca la traba con un sello hermético.'],
   ajuste:['Cables de ajuste (talla única)','Cables y correas en brazos y piernas que alargan o acortan el traje para cada cosmonauta. Así el mismo traje sirve para varias personas, y no hay que llevar uno a medida de cada una.'],
   guantes:['Guantes','Se traban en anillos de metal en las muñecas. Son lo más cansador de una caminata: con el traje inflado, cerrar la mano cuesta mucho.'],
   cuerdas:['Cuerdas de seguridad','Dos cuerdas con ganchos. Siempre hay al menos una enganchada a la estación: si el cosmonauta se suelta, no se aleja flotando.'],
   bandera:['Bandera','Cada traje lleva la bandera de quien lo usa.'],
   botas:['Botas','Rígidas en la suela, para engancharse en los anclajes de pie de la estación y tener las manos libres.'],
   franjas:['Franjas de color','Para distinguir a los dos cosmonautas en las cámaras: uno lleva franjas rojas y el otro azules (por ejemplo, en 2022 Shkaplerov iba de rojo y Dubrov de azul). Cambia el color con el botón.'],
  },
  layers:[['#b8c4d4','Prenda de enfriamiento','ropa interior con tubitos de agua'],['#55524c','Vejiga de presión','en el MKS una sola, más resistente; antes había una segunda de repuesto'],['#d7c9a8','Capa de sujeción','evita que el traje se infle como un globo'],['#d9dde3','Aislante multicapa','láminas aluminizadas contra el Sol y el frío'],['#f3f3f0','Cubierta exterior','tela blanca resistente']],
  layersNote:'Zvezda no publica el detalle de todas las capas; esta es la estructura general. Lo que sí se sabe: el Orlan‑MKS logró quitar la vejiga de repuesto gracias a una capa de presión más resistente.',
  data:[['Fabricante','NPP Zvezda, Tomilino (cerca de Moscú)'],['Primer uso','20 dic 1977, Orlan‑D, Georgi Grechko desde la estación Salyut 6'],['Modelo actual','Orlan‑MKS, en caminatas desde 2017'],['Masa','~110 kg (MKS)'],['Presión','~0,4 atm (≈ 40 kPa, 5,8 psi), oxígeno'],['Caminata','~7 h'],['Vida útil (MKS)','5–6 años o 15–20 caminatas; no vuelve a la Tierra'],['Talla','única, ajustable']],
  hist:`<p>Desde 1977, casi todas las caminatas rusas se han hecho con algún Orlan. El primero, el Orlan‑D, lo estrenó Georgi Grechko en la estación Salyut 6, asomándose por la escotilla para revisar el mecanismo de acople.</p>
   <p>Como no hace falta un traje a medida de cada persona, los trajes se quedan en la estación durante años y se usan una y otra vez. En 1997 Jerry Linenger fue el primer estadounidense en salir con un Orlan, desde la estación Mir. Michael Foale fue el primero en usar los dos: el Orlan ruso y el EMU de la NASA.</p>
   <p>El traje chino Feitian, de la primera caminata china (2008), tiene, según el astronauta Leroy Chiao, «una herencia obvia del Orlan». En esa caminata, el compañero que ayudaba desde la escotilla vestía un Orlan.</p>`,
  src:[['NASA NTRS · Comparación Orlan‑M y EMU','https://ntrs.nasa.gov/api/citations/20140009556/downloads/20140009556.pdf'],['NASA · 20 años de caminatas en la Estación','https://www.nasa.gov/feature/space-station-20th-spacewalking-history/'],['NASA blog · Caminata rusa de 2022 (franjas roja y azul)','https://www.nasa.gov/blogs/spacestation/2022/01/19/russian-spacewalkers-exit-station-to-service-russian-modules'],['Spaceflight Now · Caminata con el Orlan‑MKS (2017)','https://spaceflightnow.com/2017/08/17/russian-spacewalk/'],['Space.com · Georgi Grechko','https://space.com/36414-georgy-grechko-cosmonaut-obituary.html'],['RussianSpaceWeb · Orlan‑MKS (no oficial)','https://russianspaceweb.com/orlan_mks.html'],['NASA NTRS · Trajes en el mundo (cita de L. Chiao)','https://ntrs.nasa.gov/api/citations/20120002808/downloads/20120002808.pdf']]},
 {id:'emu',name:'EMU (NASA)',year:1983,build:buildEMU,
  kick:'1983–hoy · ILC Dover y Hamilton Standard (hoy Collins) · caminatas',
  sum:'El traje blanco de las caminatas del transbordador espacial y de la Estación Espacial Internacional. Con la mochila y el propulsor de rescate pesa unos 145 kg en la Tierra; en órbita no pesa nada, pero sigue costando moverlo porque tiene la misma masa. Lleva más de 40 años en uso.',
  parts:{
   casco:['Casco de burbuja','Burbuja de plástico transparente, como la del Apollo. Por dentro va el gorro de comunicaciones con audífonos y micrófonos.'],
   evva:['Visor EVVA','Encima de la burbuja: un visor dorado contra el Sol, otro transparente contra golpes y persianas laterales. Prueba el botón <b>Visor dorado</b>.'],
   luces:['Lámparas y cámara','Dos lámparas para la noche orbital (cada 45 minutos) y una cámara de video para que en Houston vean lo que ve el astronauta. Prueba el botón <b>Luces</b>.'],
   dcm:['Módulo de pantalla y control (DCM)','La caja del pecho: interruptores, perillas, la válvula de purga y una pantalla que muestra la presión, el oxígeno y el tiempo. Las letras de los controles están escritas al revés, para leerlas con el espejo de la muñeca.'],
   hut:['Torso superior rígido (HUT)','Una pieza dura de fibra de vidrio. A ella se enganchan la mochila, el panel del pecho, los brazos y el casco. Se fabricó en 3 tallas; las piernas y los brazos se cambian por piezas de otro largo. Así se arma el traje para cada astronauta.'],
   plss:['Mochila de soporte vital (PLSS)','Oxígeno, filtro de CO₂, ventilador, agua de enfriamiento, radio y batería. Da para unas 7 horas de caminata, más 30 minutos de oxígeno de reserva. Se construyeron 18; en 2017 quedaban 11 en servicio.'],
   safer:['SAFER: el salvavidas a chorro','Una caja debajo de la mochila con 24 toberas pequeñas de nitrógeno. Si el astronauta se suelta y se aleja flotando, saca un control y se impulsa de vuelta; el aparato lo endereza solo. Se probó por primera vez en 1994. Nunca hubo que usarlo en una emergencia real.'],
   cojinetes:['Cojinetes de los brazos','Anillos con rodamientos en hombros y brazos. Sin ellos, girar el brazo dentro del traje inflado sería como torcer un globo.'],
   guantes:['Guantes con calentadores','Los guantes Phase VI llevan cables calentadores en las puntas de los dedos, porque en la sombra el metal de la estación está muy frío. Son la pieza que más se desgasta.'],
   lista:['Lista en la muñeca','Un cuadernito de 27 páginas con espiral, en el brazo izquierdo, con los pasos de la caminata.'],
   espejo:['Espejo de la muñeca','Con el casco puesto no se ve el propio pecho. El espejo sirve para leer el panel DCM, que por eso tiene las letras invertidas.'],
   cuerdas:['Cuerdas de seguridad','Anillos en D en la cintura para las cuerdas. La regla es estar siempre enganchado a la estación.'],
   lta:['Parte inferior (LTA)','Pantalón con botas, unido al torso por un anillo con rodamiento en la cintura, que deja girar la cadera.'],
   bandera:['Bandera','La bandera del país del astronauta, en el hombro.'],
   botas:['Botas','Suela rígida para trabar los pies en los anclajes y trabajar con las dos manos.'],
   franjas:['Franjas rojas','Cuando salen dos astronautas con trajes iguales, uno lleva franjas rojas en las piernas para que en las cámaras se sepa quién es quién. Prueba el botón <b>Franjas rojas</b>.'],
  },
  layers:[['#b8c4d4','Prenda de enfriamiento (LCVG)','forro de nailon tricot y spandex con tubitos de agua'],['#55524c','Vejiga de presión','nailon recubierto de uretano'],['#cfc7b5','Capa de sujeción','Dacron'],['#6c5a48','Forro térmico','nailon ripstop con neopreno'],['#d9dde3','Aislante','7 capas de Mylar aluminizado con malla de Dacron'],['#f3f3f0','Cubierta exterior','Ortho‑Fabric: mezcla de Gore‑Tex, Kevlar y Nomex']],
  layersNote:'14 capas en total, según la NASA. Las de Mylar funcionan como espejos que rebotan el calor del Sol y guardan el del cuerpo en la sombra.',
  data:[['Fabricantes','ILC (el traje) y Hamilton Standard, hoy Collins Aerospace (la mochila)'],['Primera caminata','7 abr 1983, STS‑6 (Challenger): Story Musgrave y Don Peterson'],['Masa','~145 kg con mochila y SAFER (en la Tierra)'],['Presión','4,3 psi (29,6 kPa) de oxígeno puro'],['Caminata','hasta 7 h + 30 min de reserva'],['Capas','14'],['Mochilas','18 construidas; 11 en servicio en 2017'],['Vida útil prevista','15 años… y ya van más de 40']],
  hist:`<p><b>Prerrespiración.</b> En la estación se respira aire a la presión de la Tierra, pero el traje va a 4,3 psi de oxígeno puro. Si se pasara de golpe, el nitrógeno disuelto en la sangre haría burbujas, como una gaseosa al abrirla. Por eso, antes de salir, los astronautas respiran oxígeno puro durante horas para sacar el nitrógeno del cuerpo.</p>
   <p>El EMU se estrenó el 7 de abril de 1983, cuando Story Musgrave y Don Peterson salieron de la bodega del Challenger. Se diseñó para durar 15 años y se sigue usando en la Estación Espacial.</p>
   <p>El 16 de julio de 2013, durante una caminata, al astronauta italiano Luca Parmitano se le empezó a llenar el casco de agua: llegó a tener 1,5 litros que le tapaban los ojos, la nariz y los oídos. Volvió a la escotilla guiándose por la cuerda de seguridad y no le pasó nada. Un filtro tapado dejaba pasar el agua del enfriamiento al aire; la NASA hizo 49 cambios después.</p>`,
  src:[['NASA · Ficha del EMU (PDF)','https://www.nasa.gov/wp-content/uploads/2009/07/188963main_extravehicular_mobility_unit.pdf'],['NASA · EMU de la Estación (2019, PDF)','https://www.nasa.gov/wp-content/uploads/2015/07/2019_07_ea_emu.pdf'],['NASA · Libro de datos del EMU (PDF)','https://www.nasa.gov/wp-content/uploads/2017/02/esoc-13_rev._v_emu_hardware_data_book_jsc-e-daa-tn55224.pdf'],['NASA OIG · Informe sobre los trajes (2017)','https://oig.nasa.gov/docs/IG-17-018.pdf'],['NASA · Riesgo de descompresión','https://www.nasa.gov/reference/risk-of-decompression-sickness'],['NASA · 10 años de la EVA 23 (Parmitano)','https://nasa.gov/general/10-years-ago-eva-23-how-a-high-visibility-close-call-cut-short-a-spacewalk'],['NASA NTRS · SAFER','https://ntrs.nasa.gov/citations/19960022260'],['ESA · El traje de Tim Peake','https://www.esa.int/ESA_Multimedia/Images/2015/10/Tim_Peake_EVA_suit']]},
 {id:'aces',name:'ACES «calabaza»',year:1994,build:buildACES,
  kick:'1994–2011 · David Clark Company (EE. UU.) · despegue y regreso',
  sum:'El traje naranja de los astronautas del transbordador espacial, apodado «calabaza». Nació por el accidente del Challenger (1986): si algo fallaba, tenía que mantenerlos vivos a gran altura, dejarlos saltar en paracaídas y que flotaran en el mar hasta que los rescataran. Es naranja para que se vea desde lejos en el agua.',
  parts:{
   casco:['Casco de presión','Un casco cerrado que se conecta al anillo del cuello. Con el visor bajado, el traje queda sellado y se puede inflar.'],
   visor:['Visor móvil','Se sube para hablar y comer, y se baja y traba en el despegue, el regreso o si la cabina pierde aire. Prueba el botón <b>Visor</b>.'],
   cuello:['Cierre del cuello («neck dam»)','Un cuello de goma bien ajustado que separa el casco del resto del traje. Tiene válvulas para que salga el aire exhalado.'],
   cable:['Cable de comunicaciones','El cable blanco del casco: auriculares y micrófono conectados a la radio del transbordador.'],
   arnes:['Arnés del paracaídas','Las cintas del pecho y las piernas sujetan el cuerpo al paracaídas, que se abría solo a unos 14.000 pies (4.300 m).'],
   salvavidas:['Chaleco salvavidas','Dos bolsas bajo los brazos que se inflan solas al tocar el agua: unos sensores detectan el mar, sueltan el paracaídas para que no arrastre al astronauta y llenan el salvavidas.'],
   paracaidas:['Paracaídas','La mochila del paracaídas también hacía de respaldo del asiento en el transbordador. Aquí lo ves puesto, como al saltar.'],
   balsa:['Equipo de supervivencia','Una balsa inflable para una persona, colorante para teñir el mar alrededor, espejo de señales, luz estroboscópica, bengala, radio, agua potable y pastillas contra el mareo.'],
   oxigeno:['Conexión de oxígeno','En el muslo izquierdo: aquí entraba el oxígeno de la nave. Si había que saltar, dos botellitas del traje daban unos 10 minutos de oxígeno, suficiente para bajar a donde se puede respirar.'],
   bolsillos:['Bolsillos de los hombros','Llevaban barras de luz química naranjas para ser vistos de noche.'],
   nomex:['Tela Nomex naranja','La capa exterior es Nomex, una tela que no arde, en color «naranja internacional». Debajo va una vejiga que retiene el aire y un traje con tubitos de agua fría.'],
   guantes:['Guantes','Se traban al traje con anillos; también son de presión.'],
   bandera:['Bandera','La bandera de EE. UU. en el brazo.'],
   botas:['Botas negras','Botas de cuero resistentes, para poder caminar en tierra después de un aterrizaje de emergencia.'],
  },
  layers:[['#b8c4d4','Traje de enfriamiento','tubitos de agua fría'],['#55524c','Vejiga de presión','retiene el aire si el traje se infla'],['#cfc7b5','Capa de sujeción','mantiene la forma del traje inflado'],['#e86f1c','Nomex naranja','exterior: no arde y se ve en el mar']],
  layersNote:'El LES (1988) era un traje de presión parcial; el ACES (1994) ya es de presión total: puede inflarse entero, como un traje espacial de verdad.',
  data:[['Fabricante','David Clark Company, Worcester (Massachusetts)'],['Usado','1994–2011 (antes, el LES desde 1988)'],['Presión','~3,5 psi, como el aire a unos 9.000 m de altura'],['Protege hasta','unos 30.000 m (100.000 pies)'],['Masa','traje ~14 kg; con paracaídas y equipo, ~41 kg'],['Oxígeno propio','~10 minutos (2 botellitas)'],['Color','naranja internacional']],
  hist:`<p>Antes del accidente del Challenger (28 de enero de 1986), los astronautas del transbordador volaban con monos azules, sin trajes de presión. Después, la NASA creó un sistema para escapar: el traje LES (1988) y luego el ACES (1994), hechos por la misma empresa que fabricó los trajes Gemini.</p>
   <p><b>El escape por pértiga.</b> Si el transbordador no podía llegar a una pista, se lo dejaba planeando con el piloto automático, se despresurizaba la cabina y se expulsaba la escotilla. Por debajo de unos 7.600 m (25.000 pies), cada astronauta enganchaba su arnés a una pértiga curva de casi 3 m que salía por la escotilla, y saltaba: la pértiga lo guiaba para no chocar con el ala. Prueba el botón <b>Escape por pértiga</b>. Nunca hizo falta usarlo en una misión real.</p>
   <p>El último vuelo con ACES fue el STS‑135, en julio de 2011. Los trajes naranjas de Orion, para el programa Artemis, siguen la misma idea: naranja para el mar, ahora hechos a medida y con guantes para pantallas táctiles.</p>`,
  src:[['Museo de la Fuerza Aérea de EE. UU. · ACES','https://www.nationalmuseum.af.mil/Visit/Museum-Exhibits/Fact-Sheets/Display/Article/1860483/space-shuttle-advanced-crew-escape-suit-1994-2011/'],['David Clark Company · ACES','https://www.davidclarkcompany.com/aerospace/advanced-crew-escape-suit'],['NASA NTRS · Trajes del transbordador (PDF)','https://ntrs.nasa.gov/api/citations/20140010572/downloads/20140010572.pdf'],['NASA · Supervivencia de la tripulación (PDF)','https://www.nasa.gov/wp-content/uploads/2015/07/crew-survival.pdf'],['NASA · Trajes hechos para la presión','https://www.nasa.gov/humans-in-space/spacesuits-built-to-handle-pressure'],['Smithsonian · Escapar de un transbordador','https://www.smithsonianmag.com/air-space-magazine/escape-speeding-shuttle-180975606/'],['NASA · El traje de Orion (Artemis)','https://www.nasa.gov/missions/artemis/orion-suit-equipped-to-expect-the-unexpected-on-artemis-missions']]},
 {id:'feitian',name:'Feitian (China)',year:2008,soon:true,pack:true,desc:'El traje chino para caminatas espaciales, estrenado en la Shenzhou 7.'},
 {id:'spacex',name:'Traje de SpaceX',year:2020,build:buildSpaceX,
  kick:'2020–hoy · SpaceX (EE. UU.) · cápsula Dragon',
  sum:'El traje de la cápsula Crew Dragon. Lo diseñó al principio un diseñador de vestuario de Hollywood y después los ingenieros de SpaceX lo hicieron funcionar. Como el Sokol, es un salvavidas: si la cápsula pierde el aire, se infla y mantiene vivo al astronauta. Se conecta al asiento por un solo cable en el muslo.',
  parts:{
   casco:['Casco impreso en 3D','Hecho con impresoras 3D, con válvulas, micrófonos y el mecanismo del visor dentro de la misma pieza. Cada astronauta tiene el suyo.'],
   visor:['Visor','Se sube y se traba para hablar; se baja para sellar el traje. Prueba el botón <b>Visor</b>.'],
   paneles:['Paneles grises','Zonas de otro material en los costados y los hombros, donde el traje necesita doblarse o resistir más.'],
   cierre:['Cierre frontal','El traje se pone por delante, como un mono de trabajo.'],
   umbilical:['Un solo umbilical','En el muslo derecho: un conector con 14 pines para energía y datos, un puerto ancho para el aire y otro pequeño de alta presión. Va al asiento, que SpaceX diseñó junto con el traje como un solo sistema «traje‑asiento».'],
   guantes:['Guantes táctiles','Las puntas de los dedos conducen electricidad, para manejar las pantallas táctiles de la Dragon sin quitarse los guantes. La Dragon casi no tiene botones.'],
   capas:['Tres capas','Según el astronauta japonés Soichi Noguchi: una capa exterior con teflón, un núcleo reforzado con fibras y una capa interior hermética. Resiste el fuego y los golpes.'],
   bandera:['Bandera','La bandera del país del astronauta.'],
   botas:['Botas con guía en el talón','La pieza metálica del talón encaja en el asiento y traba el pie durante el despegue.'],
   eva:['Versión de caminata (Polaris Dawn)','Pulsa <b>Versión EVA</b>. En 2024 SpaceX hizo un traje para salir al espacio: casco con pantalla HUD (presión, temperatura, humedad), cámara, y un visor con una capa de cobre y óxido de indio y estaño que refleja la luz del Sol. No lleva mochila: el aire llega por un umbilical de unos 3,5 m desde la cápsula.'],
  },
  layers:[['#55524c','Capa interior','hermética: retiene el aire'],['#cfc7b5','Núcleo','reforzado con fibras'],['#f3f3f0','Capa exterior','con teflón; resiste el fuego']],
  layersNote:'Según Soichi Noguchi (2021). SpaceX no publica la presión ni la masa del traje.',

function stopSim(){ sim=null; $('gauge').hidden=true; FIG.forEach(F=>{ if(F.s.id==='sokol'){ F.pT=0; } }); }

const ESCAPE=[[0,'1. A unos 18.000 m (60.000 pies) el transbordador planea solo con el piloto automático, sin poder llegar a una pista.'],[3,'2. Se despresuriza la cabina y la escotilla sale disparada con explosivos.'],[6,'3. Por debajo de ~7.600 m sale por la escotilla una pértiga curva de casi 3 m.'],[9,'4. Cada astronauta engancha su arnés a la pértiga y salta: la pértiga curva lo aleja del ala izquierda.'],[12,'5. El paracaídas se abre solo a unos 4.300 m.'],[15,'6. Al tocar el agua, el paracaídas se suelta y el salvavidas se infla. A esperar el rescate en la balsa naranja.'],[19,null]];
function stepsSim(title,steps){ $('gauge').hidden=false; $('gk').textContent=title; $('gv').innerHTML=''; $('gb').style.width='0%'; sim={kind:'steps',steps,t:0,step:-1}; }
function leakTest(){
  const F=FIG[cur]; F.vT=1; $('acts').querySelectorAll('.tb')[1]?.setAttribute('aria-pressed',true);
  $('gauge').hidden=false; $('gk').textContent='Prueba de fugas · Sokol KV‑2';
  sim={kind:'sokol',t:0,step:-1};
}
const SOK=[[0,'1. Cerrar el visor y ajustar las correas.'],[2,'2. Inflar por encima de la presión de trabajo.'],[5,'3. Esperar sin tocar nada: si la aguja baja, hay una fuga (1 minuto real, aquí acelerado).'],[9,'4. Sin fugas ✓. Desinflar y abrir el visor. El traje está listo para el despegue.'],[12,null]];
function stepSim(dt){
  if(!sim) return; sim.t+=dt; const F=FIG[cur];
  if(sim.kind==='a7l'){ const v=3.7*F.p; $('gv').innerHTML=`${fmt(v)} <small>psi · ${fmt(v*6.895,0)} kPa</small>`; $('gb').style.width=(F.p*100)+'%'; }
  if(sim.kind==='steps'){ let st=0; for(let k=0;k<sim.steps.length;k++) if(sim.t>=sim.steps[k][0]) st=k; const last=sim.steps[sim.steps.length-1][0];
    if(st!==sim.step){ sim.step=st; if(sim.steps[st][1]) $('glog').textContent=sim.steps[st][1]; }
    $('gv').innerHTML=`Paso ${Math.min(st+1,sim.steps.length-1)} <small>de ${sim.steps.length-1}</small>`; $('gb').style.width=Math.min(100,sim.t/last*100)+'%'; if(sim.t>last) sim=null; return; }
  if(sim.kind==='pct'){ $('gv').innerHTML=`${fmt(F.p*100,0)} % <small>inflado</small>`; $('gb').style.width=(F.p*100)+'%'; return; }
  if(sim.kind==='gen'){ const v=sim.psi*F.p; $('gv').innerHTML=`${fmt(v)} <small>psi · ${fmt(v*6.895,0)} kPa</small>`; $('gb').style.width=(F.p*100)+'%'; }
  if(sim.kind==='sokol'){
    let st=0; for(let k=0;k<SOK.length;k++) if(sim.t>=SOK[k][0]) st=k;
    if(st!==sim.step){ sim.step=st; if(SOK[st][1]) $('glog').textContent=SOK[st][1];
      if(st===1) F.pT=1; if(st===3){ F.pT=0; } if(st===4){ F.vT=0; $('acts').querySelectorAll('.tb')[1]?.setAttribute('aria-pressed',false); setTimeout(()=>{ if(sim&&sim.kind==='sokol'){ sim=null; } },10); } }
    const pc=F.p*100;
    $('gv').innerHTML=`${fmt(pc,0)} % <small>de la presión de prueba</small>`; $('gb').style.width=pc+'%';
  }
}

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); let down=null;

  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(FIG.map(F=>F.root),true)[0]; if(!hit) return; const i=hit.object.userData.suit;

function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=w<700?40:32; camera.updateProjectionMatrix();
  // en pantalla ancha el panel tapa la derecha: corremos el centro de la vista
  // en el teléfono la hoja de abajo tapa la mitad: subimos el centro de la vista
  const pw=w>860?416:0, ph=w>860?0:Math.round(h*.46+56);
  camera.fov=2*Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov)/2)*(h+ph)/h)*180/Math.PI;
  camera.aspect=(w+pw)/(h+ph); camera.setViewOffset(w+pw,h+ph,pw,ph,w,h); camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

const clock=new THREE.Clock(); const tmp=V3();
function tick(){
  const raw=clock.getDelta(), dt=Math.min(.05,raw), now=clock.elapsedTime;
  if(fly){ fly.t=Math.min(1,fly.t+Math.min(raw,.5)/1.3); const k=smooth(fly.t); camera.position.lerpVectors(fly.p0,fly.p1,k); controls.target.lerpVectors(fly.t0,fly.t1,k); if(fly.t>=1) fly=null; }
  controls.update();
  for(const F of FIG){ if(!F.s.build) continue;
    F.p+= (F.pT-F.p)*Math.min(1,dt*1.6); F.v+=(F.vT-F.v)*Math.min(1,dt*3);
    const sc=1+.045*F.p; F.f.inflate.forEach(m=>{ m.scale.x=sc*(m.userData.sx||1); m.scale.z=sc*(m.userData.sz||1); });
    F.f.P.arms.forEach((ag,k)=>{ const s=k?1:-1; ag.rotation.z=s*(.16+.2*F.p); ag.rotation.x=-.06*F.p; });
    F.f.P.legs.forEach((lg,k)=>{ lg.rotation.z=(k?1:-1)*.035*F.p; });
    if(F.s.id==='a7l') F.f.anim.visorPivot.rotation.x=-(1-F.v)*1.05;
    if(F.s.id==='sokol') F.f.anim.visorPivot.rotation.x=-(1-F.v)*1.15;
    if(F.s.id==='emu') F.f.anim.visorPivot.rotation.x=-(1-F.v)*1.05;
    if(F.s.id==='aces'||F.s.id==='spacex') F.f.anim.visorPivot.rotation.x=-(1-F.v)*1.1;
    if(F.s.id==='orlan'){ F.d=(F.d||0)+((F.dT||0)-(F.d||0))*Math.min(1,dt*2.2); F.f.anim.door.rotation.y=-1.5*F.d; F.f.anim.filtVis.rotation.x=-(1-F.v)*.75; }
    if(F.f.anim.lampL) F.f.anim.lampL.forEach(l=>{ l.material.emissiveIntensity+=((F.lights?6:0)-l.material.emissiveIntensity)*Math.min(1,dt*6); });
  }
  stepSim(dt);
  hl.forEach((m,mesh_)=>{ mesh_.material.emissiveIntensity=.12+.1*Math.sin(now*4); });
  renderer.render(scene,camera);
  // números sobre las piezas
  if(cur>=0&&!SUITS[cur].soon&&tab==='partes'){ const F=FIG[cur], w=innerWidth, h=innerHeight; const cd=camera.getWorldDirection(V3());
    for(const t of tags.children){ const pt=F.f.parts[t.dataset.k]; if(!pt){ t.style.display='none'; continue; }
      if((t.dataset.k==='franjas'&&!F.stripes&&F.s.id!=='orlan')||(t.dataset.k==='eva'&&!F.eva)){ t.style.display='none'; continue; }
      pt.obj.localToWorld(tmp.copy(pt.pos)); const loc=F.root.worldToLocal(tmp.clone()), camL=F.root.worldToLocal(camera.position.clone());
      const back=(loc.z<-.05&&camL.z>0)||(loc.z>.08&&camL.z<0);
      tmp.project(camera); const vis=tmp.z<1;
      t.style.display=vis?'':'none'; t.style.transform=`translate(${(tmp.x*.5+.5)*w}px,${(-tmp.y*.5+.5)*h}px)`; t.classList.toggle('back',back); }
  }
  requestAnimationFrame(tick);
}
FIG.forEach(F=>{ if(F.f.anim.stripes&&F.s.id!=='orlan') F.f.anim.stripes.forEach(m=>m.visible=false); });
// arranque: vista de toda la sala y luego vuela al traje del enlace (o al A7L)
camera.position.set(0,3,11); controls.target.set(0,1.3,0);
const hi=SUITS.findIndex(s=>'#'+s.id===location.hash); select(hi>=0?hi:2);
tick();
addEventListener('keydown',e=>{ if(e.key==='ArrowRight') select(Math.min(N-1,cur+1)); if(e.key==='ArrowLeft') select(Math.max(0,cur-1)); });
</script>
