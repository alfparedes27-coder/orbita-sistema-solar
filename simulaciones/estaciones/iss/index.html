<style>
:root{
  --panel:rgba(9,12,19,.9); --line:#222b3e; --line2:#33405c; --ink:#eef0f5; --dim:#9ba4b8; --acc:#7cc4ff; --warm:#ffb547; --ok:#7ee2a8;

  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px); color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#000;color:var(--ink);font-family:var(--f-body);font-size:14px}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;outline:none}
button{font-family:var(--f-body)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px)}

.bar{position:fixed;left:16px;right:calc(390px + 32px);bottom:calc(14px + var(--bot));z-index:8;display:flex;gap:6px;flex-wrap:wrap;padding:8px;align-items:center}

.side .hd{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.side .k{font:500 10.5px var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--warm)}
.side h2{margin:3px 0 4px;font:700 20px var(--f-display)}.side .hd p{margin:0;color:var(--dim);font-size:13px;line-height:1.5}
.bd{flex:1;overflow-y:auto;padding:10px 14px 16px;font-size:13.5px;line-height:1.55}
.bd h3{font:600 12px var(--f-data);text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:16px 0 6px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:6px 0}dl.kv dt{color:var(--dim);font-size:12.5px}dl.kv dd{margin:0;font:500 13px var(--f-data);text-align:right}
.big{font:600 26px var(--f-display);font-variant-numeric:tabular-nums}
.pl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.pl button{width:100%;display:grid;grid-template-columns:30px 1fr;gap:2px 9px;text-align:left;background:none;border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink);cursor:pointer;font-size:13px}
.pl .n{grid-row:span 2;min-width:26px;height:22px;border-radius:11px;background:#1a2336;display:grid;place-items:center;font:600 10.5px var(--f-data);padding:0 4px}
.pl button[aria-current=true]{border-color:var(--warm)}.pl button[aria-current=true] .n{background:var(--warm);color:#1a1100}

.mods button[aria-current=true]{border-color:var(--warm);color:var(--warm)}
.pass{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:5px 0;font-size:12.5px}.pass b{font:600 13px var(--f-data)}.pass.vis{border-color:var(--ok)}
.src{margin:14px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}.src ul{margin:4px 0 0;padding-left:16px}.src a{color:var(--acc);word-break:break-word}
#pts{position:fixed;inset:0;pointer-events:none;z-index:6}
.pt{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:1.5px solid #fff;background:rgba(8,12,20,.78);color:#fff;font:600 11px var(--f-data);display:grid;place-items:center;cursor:pointer;pointer-events:auto;padding:0}

.pt.act span{font:600 12px var(--f-body);display:none}.pt.act:hover span,.pt.act:focus-visible span{display:inline}
.pl .ico{grid-row:span 2;font-size:20px;line-height:1;padding-top:2px}
.pl .go{grid-column:2;justify-self:start;margin-top:6px;background:var(--warm);color:#1a1100;border-radius:7px;padding:5px 10px;font:600 12px var(--f-body)}
.pl button:not([aria-current=true]) .go{display:none}
.steps{list-style:none;margin:0;padding:0;counter-reset:st}.steps li{position:relative;padding:7px 8px 7px 36px;border:1px solid var(--line);border-radius:8px;margin:5px 0;color:var(--dim)}

.steps li.done{color:var(--ink)}.steps li.done::before{content:'✓';background:var(--ok);color:#06210f}.steps li.now{border-color:var(--warm);color:var(--ink)}.steps li.now::before{background:var(--warm);color:#1a1100}
.steps li b{display:block;color:var(--ink);font-weight:600}.steps li .x{display:none;margin-top:4px;font-size:12.5px;color:#c9cfdb}.steps li.now .x{display:block}
.prog{height:6px;border-radius:3px;background:#1a2336;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--warm);width:0}
#helmet{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse 72% 64% at 50% 48%,transparent 60%,rgba(0,0,0,.45) 76%,rgba(0,0,0,.92) 90%,#000 100%);transition:opacity .8s}
#helmet::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.07) 0 18%,transparent 30% 100%),radial-gradient(ellipse 72% 64% at 50% 48%,transparent 70%,rgba(200,160,60,.08) 100%)}
#suitHud{position:fixed;left:50%;top:calc(110px + var(--top));transform:translateX(-50%);z-index:6;background:rgba(0,8,4,.55);padding:5px 12px;border-radius:8px;font:500 12px var(--f-data);color:#8ff0b4;text-shadow:0 0 6px rgba(80,255,150,.5);letter-spacing:.04em;text-align:center;pointer-events:none;white-space:nowrap}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-130%);font:600 11.5px var(--f-body);color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000;white-space:nowrap;pointer-events:none}
.hud{position:fixed;left:16px;top:calc(66px + var(--top));z-index:7;padding:8px 12px;font:500 12px var(--f-data);color:var(--dim);max-width:340px;line-height:1.55}

.move{position:fixed;left:16px;bottom:calc(82px + var(--bot));z-index:8;display:grid;grid-template-columns:repeat(3,52px);gap:6px}
.move button{height:52px;border-radius:12px;border:1px solid var(--line2);background:rgba(9,12,19,.8);color:var(--ink);font-size:20px;touch-action:none;user-select:none;-webkit-user-select:none}
.move button:active{background:var(--acc);color:#04121f}
.cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.6);z-index:5;pointer-events:none}
.tl{width:100%;accent-color:var(--warm)}
.date{font:600 22px var(--f-display);color:var(--warm)}
.ldg{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:#000;color:var(--dim);font:500 13px var(--f-data);transition:opacity .6s}
.lnch{position:fixed;left:50%;top:calc(70px + var(--top));transform:translateX(-50%);z-index:8;padding:10px 16px;text-align:center;min-width:280px}
.lnch .t{font:700 30px var(--f-data);color:var(--warm);font-variant-numeric:tabular-nums}
.lnch .ev{font:600 14px var(--f-display);margin-top:2px}
.lnch .tel{display:flex;gap:16px;justify-content:center;font:500 12px var(--f-data);color:var(--dim);margin-top:6px}.lnch .tel b{color:var(--ink);font-weight:500}
@media (max-width:900px){
  .side{left:0;right:0;top:auto;bottom:0;width:auto;height:42vh;border-radius:14px 14px 0 0}
  .bar{left:8px;right:8px;bottom:calc(42vh + 6px);padding:6px}
  .hud{display:none}.title{display:none}
  .move{bottom:calc(42vh + 64px);left:8px;grid-template-columns:repeat(3,46px)}.move button{height:46px}
  .lnch{top:calc(58px + var(--top));min-width:0;width:calc(100% - 32px)}.lnch .t{font-size:24px}
  .hint{display:none}
  #suitHud{white-space:normal;width:92vw;font-size:10.5px;top:calc(100px + var(--top))}
  body[data-mode=dentro] .side{height:30vh} body[data-mode=dentro] .bar{bottom:calc(30vh + 6px)} body[data-mode=dentro] .move{bottom:calc(30vh + 112px);left:auto;right:8px}
  .where{top:calc(60px + var(--top))}
}
</style>

<body>

  <a class="back panel" href="../">← Estaciones</a>

  <div class="tabs panel" role="tablist">
    <button class="tab" role="tab" data-mode="orbita" aria-selected="true">🌍 En órbita</button>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MODS, MOD, FLIGHTS, VEH, SITES, STATS, SPOTS, D, fdate } from './datos.js';
import { buildStation } from './modelo.js';
import { buildInterior } from './interior.js';
import { loadTLE, Orbit, sunECI, inShadow, passes, compass, makeSky, stationBasis } from './orbita.js';
import { Launch } from './lanzamiento.js';

const $ = (id) => document.getElementById(id);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const canvasEl = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas:canvasEl, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.autoClear = false; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const pmrem = new THREE.PMREMGenerator(renderer);

// ---------- escenas ----------
const sky = makeSky();
const ext = new THREE.Scene(), inn = new THREE.Scene();
// reflejos del exterior: negro arriba, Tierra azul abajo
{ const es = new THREE.Scene(); const sph = new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), new THREE.ShaderMaterial({ side:THREE.BackSide,
    vertexShader:'varying vec3 p; void main(){ p = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader:'varying vec3 p; void main(){ float y = normalize(p).y; vec3 c = mix(vec3(.32,.45,.62), vec3(.0), smoothstep(-.25,.15,y)); gl_FragColor = vec4(c,1.); }' })); es.add(sph);
  ext.environment = pmrem.fromScene(es, .02).texture; }
inn.environment = pmrem.fromScene(new RoomEnvironment(renderer), .04).texture;
const sun = new THREE.DirectionalLight(0xfff6ea, 3.4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-70, right:70, top:70, bottom:-70, near:1, far:260 }); sun.shadow.bias = -.0004; sun.shadow.normalBias = .04;
ext.add(sun, sun.target);
const earthShine = new THREE.HemisphereLight(0x000000, 0x5a7fb0, .5); ext.add(earthShine);
ext.add(new THREE.AmbientLight(0xffffff, .03));
const innAmb = new THREE.HemisphereLight(0xf4f2ea, 0x7a8088, .32); inn.add(innAmb);
const head = new THREE.PointLight(0xfff4e6, 1.6, 6, 1.6); inn.add(head);
const modLights = [0,1,2].map(() => { const l = new THREE.PointLight(0xf2f5ff, 3.2, 8, 1.5); inn.add(l); return l; });

const station = buildStation(); ext.add(station.root);
station.root.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
const intr = buildInterior(); inn.add(intr.root);

const cam = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .05, 2000);
const ctl = new OrbitControls(cam, canvasEl); ctl.enableDamping = true; ctl.dampingFactor = .08; ctl.minDistance = 12; ctl.maxDistance = 400; ctl.target.set(0, 0, 0);
cam.position.set(70, 32, 95);
const gcam = sky.cam; const gctl = new OrbitControls(gcam, canvasEl); gctl.enableDamping = true; gctl.minDistance = 8000; gctl.maxDistance = 90000; gctl.enabled = false;

// ---------- reloj y órbita ----------
let orbit = null, tleSrc = null, simT = Date.now(), speed = 1, lastReal = performance.now();
const sunE = new THREE.Vector3();
let passList = [];
async function initOrbit(){
  const t = await loadTLE(); tleSrc = t.src; orbit = new Orbit(t.l); orbit.at(new Date(simT));
  setTimeout(() => { passList = passes(orbit); if (mode === 'orbita') panelOrbit(); }, 50);
}

// ---------- vista del globo: órbita, traza y Guayaquil ----------
const globe = new THREE.Group(); sky.scene.add(globe); globe.visible = false;
const orbitLine = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color:0xffb547, transparent:true, opacity:.9 })); globe.add(orbitLine);
const trackLine = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineDashedMaterial({ color:0x7cc4ff, dashSize:120, gapSize:80 })); globe.add(trackLine);
const mkSprite = (col, s) => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); const gr = g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'#fff'); gr.addColorStop(.25,col); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0,0,64,64);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(c), depthTest:true, transparent:true })); sp.scale.setScalar(s); return sp; };
const issDot = mkSprite('#ffb547', 900); globe.add(issDot);
const mkLbl = (t) => { const d = document.createElement('div'); d.className = 'lbl'; d.textContent = t; d.hidden = true; document.body.append(d); return d; };
const lblISS = mkLbl('Estación Espacial'), lblGYE = mkLbl('Guayaquil');
const gyeDot = mkSprite('#7ee2a8', 500); globe.add(gyeDot);
let orbitDrawnAt = 0;
function drawOrbitGlobe(){
  const pts = [], trk = [], P = orbit.periodMin()*60e3, M = new THREE.Matrix4();
  const toG = new THREE.Matrix4().makeBasis(V(1,0,0), V(0,0,-1), V(0,1,0));
  for (let k = -.5; k <= 1.0001; k += 1/240){
    const d = new Date(simT + k*P); if (!orbit.at(d)) continue;
    pts.push(orbit.r.clone().applyMatrix4(toG));
    // traza sobre el suelo: punto debajo, girando con la Tierra (se dibuja en el marco del globo con la Tierra de ahora)
    const ecef = orbit.r.clone().applyAxisAngle(V(0,0,1), -orbit.gmst).normalize().multiplyScalar(6378 + 15);
    const nowG = satellite.gstime(new Date(simT)); trk.push(ecef.applyAxisAngle(V(0,0,1), nowG).applyMatrix4(toG));
  }
  orbitLine.geometry.dispose(); orbitLine.geometry = new THREE.BufferGeometry().setFromPoints(pts);
  trackLine.geometry.dispose(); trackLine.geometry = new THREE.BufferGeometry().setFromPoints(trk); trackLine.computeLineDistances();
  orbit.at(new Date(simT)); orbitDrawnAt = simT;
}

// ---------- modos ----------
let mode = 'orbita', view = 'cerca';
const tabs = [...document.querySelectorAll('.tab')];
tabs.forEach(b => b.onclick = () => setMode(b.dataset.mode));
function setMode(m){
  if (EVA.step >= 0 || EVA.out){ if (EVA.out){ goInsideLock(); } tasks.length = 0; Q.outer(false); Q.inner(true); Q.state.inLock = false; Q.suit(true); Q.press(101.3, 'CABINA NORMAL'); helmet(false); setSoundLevel(1); EVA.step = -1; EVA.busy = false; }
  if (cine){ ext.remove(cine.g); cine = null; }
  windowMode(false);
  if (launch){ launch.dispose(); launch = null; $('lnch').hidden = true; }
  mode = m; document.body.dataset.mode = m; tabs.forEach(b => b.setAttribute('aria-selected', String(b.dataset.mode === m)));
  $('move').hidden = m !== 'dentro'; $('hud').hidden = m !== 'orbita'; $('cross').hidden = m !== 'dentro'; $('where').hidden = m !== 'dentro'; $('pts').innerHTML = ''; spotEls = [];
  ctl.enabled = m !== 'dentro' && !(m === 'orbita' && view === 'globo'); gctl.enabled = m === 'orbita' && view === 'globo';
  station.root.visible = m !== 'dentro'; intr.root.visible = m === 'dentro'; lblISS.hidden = lblGYE.hidden = true;
  if (m !== 'dentro' && cam.position.length() < 30){ cam.position.set(70, 32, 95); } if (m !== 'dentro') cam.fov = innerWidth < innerHeight ? 72 : 55;
  if (m === 'orbita'){ station.setDate(Date.now()); barOrbit(); panelOrbit(); if (view === 'cerca') { cam.near = .5; ctl.target.set(0,0,0); } }
  if (m === 'dentro'){ station.setDate(Date.now()); enterInside(); }
  if (m === 'armado'){ view = 'cerca'; globe.visible = false; cam.near = .5; ctl.target.set(0,0,0); barArmado(); pickFlight(flightIdx); }
  cam.updateProjectionMatrix(); history.replaceState(null, '', '#' + m);
}

// ---------- 1 · en órbita ----------
function barOrbit(){

    run(next){ Q.state.inLock = true; Q.inner(true); tween(1.7, () => {}, () => flyTo(Q.lockCenter, Q.lockLook, () => { Q.inner(false); tween(1.7, () => {}, next); })); } },
  { t:'Sacar el aire', x:'Una bomba devuelve casi todo el aire a la estación, para no desperdiciarlo. A 34 kPa se detiene para revisar que el traje no tenga fugas. Después se abre una válvula y el resto se va al espacio. Al final ya no se escucha nada: el sonido no viaja en el vacío.',
    run(next){ tween(5, (k) => { const p = 101.3 - 66.8*k; Q.press(p, 'BOMBEANDO AIRE'); setSoundLevel(p/101.3); setProg(k*.45); },
      () => tween(2.5, (k) => { Q.press(34.5, 'REVISIÓN DE FUGAS…'); setProg(.45 + k*.1); },
      () => tween(5, (k) => { const p = 34.5*(1 - k); Q.press(p, p < .5 ? 'VACÍO' : 'VENTEO AL ESPACIO'); setSoundLevel(p/101.3*.6); setProg(.55 + k*.45); }, next))); } },
  { t:'Abrir la escotilla exterior', x:'La escotilla de un metro se abre hacia afuera. Primero sale un astronauta, engancha su cuerda de seguridad a la estación y después ayuda al compañero.',
    run(next){ Q.outer(true); tween(2.4, () => {}, next); } },
  { t:'Salir al espacio', x:'Ya estás afuera, atado a la estación con una cuerda de acero de 25 m. Muévete con las flechas o W A S D; arrastra para mirar. Cada 45 minutos pasas del día a la noche. Cuando termines, vuelve a la esclusa.',
    run(next){ goOutside(); next(); } },
  { t:'Volver a la esclusa y cerrar', x:'Se entra con los pies primero, se cierra la escotilla exterior y se asegura con la manija.',
    run(next){ goInsideLock(); Q.outer(false); tween(2.4, () => {}, next); } },
  { t:'Meter aire a la esclusa', x:'Se vuelve a llenar la esclusa con aire de la estación hasta la presión normal: 101,3 kPa, la misma que al nivel del mar.',
    run(next){ tween(6, (k) => { const p = 101.3*k; Q.press(p, k < 1 ? 'PRESURIZANDO' : 'CABINA NORMAL'); setSoundLevel(k); setProg(k); }, next); } },
  { t:'Abrir la escotilla y quitarse el traje', x:'De vuelta en la estación. Después de una caminata de unas seis horas y media, los astronautas suelen tener las manos cansadas y a veces las uñas lastimadas de tanto apretar dentro de los guantes.',
    run(next){ Q.inner(true); tween(1.7, () => {}, () => flyTo(Q.eqCenter, Q.backLook, () => { Q.state.inLock = false; Q.suit(true); helmet(false); next(); })); } },
];
function setProg(k){ const i = document.querySelector('#evaProg i'); if (i) i.style.width = (k*100).toFixed(0) + '%'; }
function helmet(on){ $('helmet').hidden = !on; $('suitHud').hidden = !on; }
function startEVA(){ EVA.step = 0; EVA.busy = false; panelEVA(); barEVA(); }
function nextEVA(){
  if (EVA.busy || EVA.step < 0 || EVA.step >= EVA_STEPS.length) return;
  EVA.busy = true; barEVA(); setProg(0);
  EVA_STEPS[EVA.step].run(() => { EVA.busy = false; EVA.step++; if (EVA.step >= EVA_STEPS.length){ EVA.step = -1; barInside(); panelInside('quest'); return; } panelEVA(); barEVA(); });
}
function cancelEVA(){ if (EVA.out || EVA.step > 4) return; Q.inner(true); Q.state.inLock = false; Q.suit(true); helmet(false); Q.press(101.3, 'CABINA NORMAL'); setSoundLevel(1); EVA.step = -1; EVA.busy = false; barInside(); panelInside('quest'); }
function panelEVA(){
  $('hd').innerHTML = `<div class="k">Esclusa Quest · actividad extravehicular</div><h2>Caminata espacial</h2><p>Haz cada paso como lo hacen los astronautas de verdad.</p>`;
  $('bd').innerHTML = `<ol class="steps">${EVA_STEPS.map((s, i) => `<li class="${i < EVA.step ? 'done' : i === EVA.step ? 'now' : ''}"><b>${s.t}</b><div class="x">${s.x}${i === EVA.step ? '<div class="prog" id="evaProg"><i></i></div>' : ''}</div></li>`).join('')}</ol>
    <div class="src">En la estación se han hecho más de 270 caminatas espaciales. La más larga duró 8 horas y 56 minutos (2001).</div>`;
  $('bd').querySelector('li.now')?.scrollIntoView({ block:'nearest' });
}
function barEVA(){
  const s = EVA_STEPS[EVA.step];
  $('bar').innerHTML = `<div class="g"><button class="tb pri" id="evaGo" ${EVA.busy ? 'disabled' : ''}>${EVA.busy ? '⏳ ' + s.t + '…' : '▶ ' + s.t}</button>${!EVA.out && EVA.step <= 4 ? '<button class="tb" id="evaX">✕ Cancelar</button>' : ''}</div>
    <div class="g"><button class="tb" id="bSnd" aria-pressed="${!!snd}">🔊 Sonido</button></div>`;
  $('evaGo').onclick = nextEVA; $('evaX') && ($('evaX').onclick = cancelEVA); $('bSnd').onclick = () => toggleSound($('bSnd'));
}
// afuera: la escena exterior, atado a la escotilla
let tether = null;
function goOutside(){
  EVA.out = true; EVA.t0 = performance.now(); EVA.anchor = Q.hatchOut.clone().addScaledVector(Q.hatchDir, -.4);
  station.setDate(Date.now()); station.root.visible = true; intr.root.visible = false;
  EVA.boxes = [];
  for (const id of [...MODS.map(m => m.id), 'pma2','pma3','ida2','ida3','z1','s0','s1','p1','bishop','v-crew','v-cargo','v-soyuz','v-prog1','v-prog2']){
    const o = station.parts.get(id); if (o && o.visible) EVA.boxes.push(new THREE.Box3().setFromObject(o).expandByScalar(.35)); }
  cam.position.copy(Q.hatchOut).addScaledVector(Q.hatchDir, .9); const d = Q.hatchDir; look.yaw = Math.atan2(-d.x, -d.z); look.pitch = -.25; vel.set(0,0,0);
  if (!tether){ tether = new THREE.Line(new THREE.BufferGeometry().setFromPoints(Array.from({ length:16 }, () => V(0,0,0))), new THREE.LineBasicMaterial({ color:0xd8d8d0 })); }
  ext.add(tether); setSoundLevel(0);
}
function goInsideLock(){ EVA.out = false; ext.remove(tether); station.root.visible = false; intr.root.visible = true; cam.position.copy(Q.lockCenter); const d = Q.lockLook.clone().sub(Q.lockCenter); look.yaw = Math.atan2(-d.x, -d.z); look.pitch = 0; }
function evaOK(p){ if (p.distanceTo(EVA.anchor) > 25) return false; for (const b of EVA.boxes) if (b.containsPoint(p)) return p.distanceTo(Q.hatchOut) < 1.6; return true; }
function stepTether(){
  const a = EVA.anchor, b = cam.position.clone().add(V(0, -.35, 0).applyQuaternion(cam.quaternion)), pts = [], sag = Math.max(0, 25 - a.distanceTo(b))*.06;
  for (let i = 0; i < 16; i++){ const t = i/15, p = a.clone().lerp(b, t); p.y -= Math.sin(t*Math.PI)*sag; pts.push(p); }
  tether.geometry.setFromPoints(pts);
}
function suitHud(){
  if ($('suitHud').hidden) return;
  const min = EVA.out ? (performance.now() - EVA.t0)/60000 : 0, o2 = Math.max(0, 100 - min*.21), dist = EVA.out ? cam.position.distanceTo(EVA.anchor) : 0;
  $('suitHud').innerHTML = `EMU · O₂ ${o2.toFixed(0)} % · TRAJE ${EVA.out || EVA.step >= 4 ? '29,6' : '101,3'} kPa · ${EVA.out ? `CUERDA ${dist.toFixed(1)} / 25 m · ${lastLit ? '☀ AL SOL' : '🌙 SOMBRA'}` : 'DENTRO DE LA ESTACIÓN'}`;
}

// ---------- 3 · armado ----------
let flightIdx = FLIGHTS.length - 1, playing = null, hl = [];
function barArmado(){
  $('bar').innerHTML = `<div class="g" style="flex:1;min-width:220px"><input type="range" class="tl" id="tl" min="0" max="${FLIGHTS.length-1}" value="${flightIdx}" aria-label="Vuelo de armado"></div>
    <div class="g"><button class="tb" id="bPrev">◀</button><button class="tb" id="bPlay">▶ Reproducir</button><button class="tb" id="bNext">▶|</button></div>
    <div class="g"><button class="tb pri" id="bLaunch">🚀 Ver el lanzamiento</button></div>`;
  $('tl').oninput = () => pickFlight(+$('tl').value);
  $('bPrev').onclick = () => pickFlight(Math.max(0, flightIdx - 1)); $('bNext').onclick = () => pickFlight(Math.min(FLIGHTS.length-1, flightIdx + 1));
  $('bPlay').onclick = () => { if (playing){ clearInterval(playing); playing = null; $('bPlay').textContent = '▶ Reproducir'; return; }
    if (flightIdx >= FLIGHTS.length - 1) pickFlight(0); $('bPlay').textContent = '⏸ Pausa';
    playing = setInterval(() => { if (flightIdx >= FLIGHTS.length - 1){ clearInterval(playing); playing = null; $('bPlay').textContent = '▶ Reproducir'; return; } pickFlight(flightIdx + 1); }, 2600); };
  $('bLaunch').onclick = () => startLaunch(FLIGHTS[flightIdx]);
}
function pickFlight(i){
  flightIdx = i; const f = FLIGHTS[i], t = D(f.d) + 20*864e5; station.setDate(i === FLIGHTS.length - 1 ? Date.now() : t);
  if ($('tl')) $('tl').value = i;
  hl.forEach(h => h.parent && h.parent.remove(h)); hl = [];
  // encuadre: la cámara se aleja o se acerca según el tamaño de la estación en esa fecha
  const bb = new THREE.Box3(); station.root.children.forEach(o => { if (o.visible) bb.expandByObject(o); });
  if (!bb.isEmpty()){ const c = bb.getCenter(V(0,0,0)), rad = bb.getSize(V(0,0,0)).length()/2, d = Math.max(28, rad*2.1);
    const dir = cam.position.clone().sub(ctl.target).normalize(); ctl.target.copy(c); cam.position.copy(c).addScaledVector(dir, d); }
  for (const id of [...f.add, ...(f.move || [])]){ const o = station.parts.get(id); if (!o || !o.visible) continue; const b = new THREE.Box3().setFromObject(o); if (b.isEmpty()) continue; const h = new THREE.Box3Helper(b, 0xffb547); ext.add(h); hl.push(h); }
  const veh = VEH[f.veh];
  $('hd').innerHTML = `<div class="k">Vuelo ${f.id} · ${i+1} de ${FLIGHTS.length}</div><div class="date">${fdate(f.d)}</div><h2>${f.t}</h2><p>${f.x}</p>`;
  $('bd').innerHTML = `<dl class="kv"><dt>Cohete</dt><dd>${veh.name}${f.orb ? ' ' + f.orb : ''}</dd><dt>Desde</dt><dd>${SITES[f.site]}</dd><dt>País</dt><dd>${veh.pais}</dd></dl>
    <button class="tb pri" id="bL2" style="width:100%;margin:6px 0 10px">🚀 Ver cómo despegó</button>
    <h3>Todos los vuelos del armado</h3><ul class="pl">${FLIGHTS.map((x, k) => `<li><button data-f="${k}" aria-current="${k === i}"><span class="n">${k+1}</span><b>${x.t}</b><span class="s">${fdate(x.d)} · ${VEH[x.veh].name}${x.orb ? ' ' + x.orb : ''}</span></button></li>`).join('')}</ul>
    <div class="src">Fuentes: <ul><li><a href="https://en.wikipedia.org/wiki/Assembly_of_the_International_Space_Station">Armado de la ISS (cronología de vuelos)</a></li><li><a href="https://www.nasa.gov/international-space-station/">NASA · ISS</a> y <a href="https://www.nasa.gov/blogs/spacestation/">blog de la estación</a> (iROSA 7 y 8, oct.–nov. 2026)</li></ul></div>`;
  $('bL2').onclick = () => startLaunch(f);
  $('bd').querySelectorAll('[data-f]').forEach(b => b.onclick = () => pickFlight(+b.dataset.f));
  $('bd').querySelector('[aria-current=true]')?.scrollIntoView({ block:'nearest' });
}

// ---------- lanzamiento ----------
let launch = null;
function startLaunch(f){
  if (playing){ clearInterval(playing); playing = null; }
  hl.forEach(h => h.parent && h.parent.remove(h)); hl = [];
  launch = new Launch({ renderer, station, ext, cam, ctl, draw:drawStation, onOrbit:() => { $('hd').querySelector('h2') && ($('hd').querySelector('p').textContent = 'Arrastra para mirar la llegada desde cualquier lado.'); } }, f, VEH[f.veh], SITES[f.site], (s) => {
    $('l-t').textContent = s.t; $('l-ev').textContent = s.ev; $('l-h').textContent = s.h; $('l-v').textContent = s.v; });
  $('lnch').hidden = false; ctl.enabled = false;
  $('bar').innerHTML = `<div class="g"><small>Velocidad</small>${[1,5,20].map(s => `<button class="tb" data-ls="${s}" aria-pressed="${s===5}">×${s}</button>`).join('')}</div>
    <div class="g"><button class="tb" id="lCam">🎥 Cambiar cámara</button><button class="tb" id="lSkip">⏭ Ir a la estación</button><button class="tb" id="lEnd">✕ Salir</button></div>`;
  $('bar').querySelectorAll('[data-ls]').forEach(b => b.onclick = () => { launch.speed = +b.dataset.ls; $('bar').querySelectorAll('[data-ls]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); });
  $('lCam').onclick = () => launch.nextCam(); $('lSkip').onclick = () => launch.skip();
  $('lEnd').onclick = () => setMode('armado');
  const veh = VEH[f.veh];
  $('hd').innerHTML = `<div class="k">${veh.name}${f.orb ? ' ' + f.orb : ''} · ${fdate(f.d)}</div><h2>${f.t}</h2><p>${SITES[f.site]}. ${veh.name} mide ${veh.alto}.</p>`;
  $('bd').innerHTML = `<h3>Cronología del ascenso</h3><ul class="pl">${veh.ev.map(([t, e]) => `<li><button><span class="n">${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}</span><b>${e}</b></button></li>`).join('')}</ul>
    <p style="color:var(--dim);font-size:12.5px;margin-top:10px">Tiempos aproximados de cada etapa para este cohete. Después del despegue la carga tarda horas o días en alcanzar a la estación: aquí lo resumimos en el acoplamiento final.</p>`;
}

// ---------- bucle ----------
function resize(){ renderer.setSize(innerWidth, innerHeight); if (mode !== 'dentro') cam.fov = innerWidth < innerHeight ? 72 : 55; for (const c of [cam, gcam]){ c.aspect = innerWidth/innerHeight; c.updateProjectionMatrix(); } }
addEventListener('resize', resize);
let frames = 0, tPrev = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - tPrev)/1000); tPrev = now;
  simT += dt*1000*(mode === 'orbita' ? speed : 1);
  if (!orbit) return;
  if (launch){ launch.step(dt); if (launch.phase === 'orb'){ ctl.update(); orbit.at(new Date(simT)); sunECI(simT, sunE); } launch.render(); return; }
  orbit.at(new Date(simT)); sunECI(simT, sunE);
  if (mode === 'orbita' && view === 'globo'){
    const s = sky.update(orbit, sunE, simT, 'globe');
    const toG = new THREE.Matrix4().makeBasis(V(1,0,0), V(0,0,-1), V(0,1,0));
    issDot.position.copy(orbit.r).applyMatrix4(toG);
    const lat = -2.19*Math.PI/180, lon = -79.89*Math.PI/180, ecef = V(Math.cos(lat)*Math.cos(lon), Math.cos(lat)*Math.sin(lon), Math.sin(lat)).multiplyScalar(6378 + 20);
    gyeDot.position.copy(ecef.applyAxisAngle(V(0,0,1), orbit.gmst)).applyMatrix4(toG);
    if (Math.abs(simT - orbitDrawnAt) > 60e3) drawOrbitGlobe();
    gctl.update(); renderer.setClearColor(0x000000); renderer.clear(); renderer.render(sky.scene, gcam);
    for (const [el, p] of [[lblISS, issDot.position], [lblGYE, gyeDot.position]]){ const q = p.clone().project(gcam), occl = p.clone().normalize().dot(gcam.position.clone().sub(p)) < 0;
      el.hidden = q.z > 1 || occl; el.style.left = (q.x*.5+.5)*innerWidth + 'px'; el.style.top = (-q.y*.5+.5)*innerHeight + 'px'; }
    if ((frames++ % 15) === 0) liveOrbit();
    return;
  }
  for (let i = tasks.length - 1; i >= 0; i--){ const t = tasks[i]; t.t += dt; t.fn(Math.min(1, t.t/t.dur)); if (t.t >= t.dur){ tasks.splice(i, 1); t.done && t.done(); } }
  if (mode === 'dentro'){ if (cine) stepCine(dt); else stepInside(dt); intr.update(now/1000, dt); }
  else ctl.update();
  if (mode === 'dentro' && cine) drawStation(ext, cine.cam);
  else drawStation(mode === 'dentro' && !EVA.out ? inn : ext);
  if ((frames++) % 10 === 0){ suitHud(); if (winOn && orbit){ const g = orbit.geo(); $('where').textContent = `Debajo de ti: ${Math.abs(g.lat).toFixed(1)}° ${g.lat >= 0 ? 'N' : 'S'}, ${Math.abs(g.lon).toFixed(1)}° ${g.lon >= 0 ? 'E' : 'O'} · ${lastLit ? 'de día' : 'de noche'}`; } }
  if ((frames++ % 15) === 0 && mode === 'orbita') liveOrbit();
}
// dibuja la Tierra de fondo y la estación (por fuera o por dentro) con la luz real del Sol
let lastLit = true;
function drawStation(scn = ext, c = cam){
  const s = sky.update(orbit, sunE, simT, 'station'); lastLit = s.lit;
  sun.position.copy(s.sunLocal).multiplyScalar(150); sun.target.position.set(0,0,0); sun.intensity = s.lit ? 3.4 : 0;
  earthShine.intensity = .55*Math.max(0, Math.min(1, s.sunLocal.y + .25)) + .03;
  station.track(s.sunLocal);
  gcam.quaternion.copy(c.quaternion); gcam.position.copy(c.position).multiplyScalar(.001); gcam.fov = c.fov; gcam.aspect = c.aspect; gcam.near = .02; gcam.far = 4e5; gcam.updateProjectionMatrix();
  renderer.setClearColor(0x000000); renderer.clear(); renderer.render(sky.scene, gcam); renderer.clearDepth();
  renderer.toneMappingExposure = scn === inn ? .78 : 1; renderer.render(scn, c); renderer.toneMappingExposure = 1;
}

// ---------- inicio ----------
await initOrbit();
const startMode = (location.hash || '').slice(1);
setMode(['orbita','dentro','armado'].includes(startMode) ? startMode : 'orbita');
$('ldg').style.opacity = 0; setTimeout(() => $('ldg').hidden = true, 700);
requestAnimationFrame(loop);
window.__iss = { tasks, EVA, runAct, nextEVA, get cine(){ return cine; }, FLIGHTS, renderer, look, setTime:(t) => { simT = t; }, get simT(){ return simT; }, cam, station, intr, setMode, goTo, get orbit(){ return orbit; }, selectSpot, pickFlight, startLaunch, get launch(){ return launch; } };
</script>
</body>
