<title>Starbase · SpaceX</title>
<meta name="description" content="Starbase, Texas, en 3D: todos los cohetes de SpaceX en fila con su historia, la torre que los atrapa, una galería para recorrer a pie con motores, cápsula, trajes y tecnologías, y la línea del tiempo de Tesla en el estacionamiento.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --void:#000; --panel:rgba(10,13,20,.92); --line:#222b3e; --line2:#33405c;
  --ink:#eef0f5; --dim:#9ba4b8; --faint:#646e86; --acc:#7cc4ff; --warm:#ffb547;
  --f-display:"Jost","Futura","Century Gothic",system-ui,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#000;color:var(--ink);font-family:var(--f-body);font-size:14px}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;outline:none}
button{font-family:var(--f-body)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px)}
.top{position:fixed;top:calc(10px + var(--top));left:16px;right:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:8;pointer-events:none}
.top>*{pointer-events:auto}
.back{color:var(--dim);text-decoration:none;font-size:12.5px;padding:8px 11px}
.title{padding:6px 13px}
.title .kick{font:500 10.5px var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.title h1{margin:1px 0 0;font:700 17px var(--f-display)}
.modes{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tb{background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:8px 11px;font-size:12.5px;cursor:pointer}
.tb:hover{border-color:var(--acc)}
.tb[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#04121f}
/* índice a la izquierda */
.idx{position:fixed;left:16px;top:calc(66px + var(--top));bottom:calc(16px + var(--bot));width:250px;z-index:7;overflow-y:auto;padding:10px 10px 12px}
.idx h3{margin:10px 4px 6px;font:500 10.5px var(--f-data);letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.idx h3:first-child{margin-top:2px}
.idx button{display:flex;width:100%;justify-content:space-between;gap:8px;align-items:baseline;text-align:left;background:none;border:0;border-radius:7px;color:var(--ink);padding:6px 8px;cursor:pointer;font-size:13px}
.idx button small{color:var(--faint);font:500 11px var(--f-data);white-space:nowrap}
.idx button:hover,.idx button[aria-current=true]{background:#152036}
/* ficha a la derecha */
.card{position:fixed;right:16px;top:calc(66px + var(--top));bottom:calc(16px + var(--bot));width:380px;z-index:9;display:flex;flex-direction:column;overflow:hidden}
.card .hd{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.card .hd div{flex:1}
.card .k{font:500 10.5px var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--warm)}
.card h2{margin:3px 0 0;font:700 21px/1.15 var(--f-display)}
.card .x{background:none;border:1px solid var(--line2);color:var(--dim);border-radius:8px;width:30px;height:30px;cursor:pointer}
.card .bd{flex:1;overflow-y:auto;padding:12px 16px 18px;line-height:1.55;font-size:13.5px}
.card .bd p{margin:0 0 10px;color:#d2d7e2}
.card .bd a{color:var(--acc)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;margin:0 0 12px}
.kv dt{color:var(--dim)} .kv dd{margin:0}
.src{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
.src ul{margin:4px 0 0;padding-left:16px} .src a{word-break:break-word}
.go{display:block;margin:8px 0 0;padding:9px 12px;border-radius:8px;background:var(--acc);color:#04121f!important;text-decoration:none;font:600 13px var(--f-display);text-align:center;border:0;cursor:pointer;width:100%}
.note{font-size:12px;color:var(--dim);border-left:2px solid var(--line2);padding-left:10px;margin:8px 0}
/* etiquetas */
#lbl{position:fixed;inset:0;pointer-events:none;z-index:5}
.lb{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;font:600 12px var(--f-display);color:#fff;background:rgba(8,12,20,.7);border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:3px 8px;pointer-events:auto;cursor:pointer}
.lb small{font:500 10px var(--f-data);color:var(--dim);margin-left:5px}
.lb:hover{border-color:var(--acc)}
/* caminar: cruz y mandos táctiles */
#cross{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;z-index:6;pointer-events:none}
#cross::before,#cross::after{content:"";position:absolute;background:rgba(255,255,255,.8)}
#cross::before{left:6px;top:0;width:2px;height:14px} #cross::after{top:6px;left:0;height:2px;width:14px}
.pad{position:fixed;left:calc(16px + 266px);bottom:calc(16px + var(--bot));z-index:8;display:grid;grid-template-columns:repeat(3,46px);gap:6px}
.pad button{height:46px;border-radius:10px;background:var(--panel);border:1px solid var(--line2);color:var(--ink);font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}
.pad .run{grid-column:3;grid-row:1;font-size:11px}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(66px + var(--top));z-index:6;padding:7px 12px;font-size:12.5px;color:var(--dim);white-space:nowrap}
.load{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:#000;font:500 13px var(--f-data);color:var(--dim)}
@media (max-width:900px){
  .idx{display:none} .idx.open{display:block;top:auto;bottom:0;left:0;right:0;width:auto;height:50vh;border-radius:14px 14px 0 0}
  .card{left:0;right:0;top:auto;bottom:0;width:auto;height:52vh;border-radius:14px 14px 0 0}
  .pad{left:16px;bottom:calc(16px + var(--bot))}
  .hint{display:none} .modes .tb{padding:7px 9px;font-size:12px}
}
@media (min-width:901px){ .tb.mob{display:none} }
</style>
</head>
<body>
<div class="load" id="load">Construyendo Starbase…</div>
<canvas id="gl" aria-label="Starbase en 3D"></canvas>
<div id="lbl"></div>
<div id="cross" hidden></div>
<div class="top">
  <a class="back panel" href="../">← Simulaciones</a>
  <div class="title panel"><div class="kick">Boca Chica, Texas · SpaceX</div><h1>Starbase</h1></div>
  <div class="modes">
    <button class="tb mob" id="bIdx">☰ Índice</button>
    <button class="tb" id="bDrone" aria-pressed="true">🛸 Dron</button>
    <button class="tb" id="bWalk" aria-pressed="false">🚶 Caminar</button>
    <button class="tb" id="bIn">🏭 Entrar a la galería</button>
  </div>
</div>
<nav class="idx panel" id="idx" aria-label="Índice"></nav>
<section class="card panel" id="card" hidden aria-live="polite">
  <div class="hd"><div><div class="k" id="ck"></div><h2 id="cn"></h2></div><button class="x" id="cx" aria-label="Cerrar">✕</button></div>
  <div class="bd" id="cb"></div>
</section>
<div class="pad" id="pad" hidden>
  <span></span><button data-k="f" aria-label="Adelante">▲</button><button class="run" data-k="run" aria-label="Correr">Correr</button>
  <button data-k="l" aria-label="Izquierda">◀</button><button data-k="b" aria-label="Atrás">▼</button><button data-k="r" aria-label="Derecha">▶</button>
</div>
<div class="hint panel" id="hint">Arrastra para girar · toca un cohete o una etiqueta para ver su historia</div>

  hist:`<p>El primer cohete de SpaceX, fundada en 2002. Los tres primeros intentos fallaron: en 2006 una fuga provocó un incendio, en 2007 no alcanzó la órbita y en agosto de 2008 las dos etapas chocaron al separarse. La empresa casi no tenía dinero para otro intento.</p><p>El <b>28 de septiembre de 2008</b>, en el cuarto intento, puso en órbita una carga de prueba de 165 kg: el primer cohete de combustible líquido desarrollado por una empresa privada en llegar a órbita. En 2009 lanzó el satélite RazakSAT de Malasia y se retiró para dar paso al Falcon 9.</p>`,src:['wf1']}),
 v10:R({grp:'cohete',name:'Falcon 9 v1.0',yrs:'2010–2013',

  hist:`<p>Voló por primera vez el 4 de junio de 2010. El 8 de diciembre de 2010 llevó la primera Dragon, que dio dos vueltas a la Tierra y amerizó en el Pacífico: la primera cápsula de una empresa privada recuperada desde órbita.</p><p>El 25 de mayo de 2012 una Dragon lanzada por este cohete se convirtió en la primera nave privada en llegar a la Estación Espacial Internacional. Sus 9 motores en cuadrícula de 3 × 3 se reemplazaron luego por la «octaweb».</p>`,src:['wv10']}),

  hist:`<p>Más largo y con motores nuevos dispuestos en «octaweb»: 8 en anillo alrededor de uno central, más fácil de fabricar y más seguro si falla uno. Con esta versión empezaron los intentos de aterrizar sobre una barcaza en el mar, todos fallidos al principio.</p><p>El 28 de junio de 2015 la misión CRS‑7 explotó a los dos minutos: un soporte de la segunda etapa llevaba un perno industrial en vez de uno aeroespacial, se rompió y un tanque de helio se soltó. Fue una lección dura sobre el control de calidad.</p>`,src:['wv11','nsfcrs7']}),
 b5:R({grp:'cohete',name:'Falcon 9 Block 5',yrs:'2015 (Full Thrust) · 2018 (Block 5) – hoy',

  hist:`<p>El cohete que cambió la industria. El <b>21 de diciembre de 2015</b> (hora de Florida) una primera etapa volvió del espacio y aterrizó de pie en Cabo Cañaveral: la primera vez para un cohete orbital. El 8 de abril de 2016 lo logró sobre la barcaza «Of Course I Still Love You», y el 30 de marzo de 2017 ese mismo propulsor volvió a volar.</p><p>La versión Block 5, desde 2018, se diseñó para volar muchas veces con revisiones mínimas: hoy un propulsor ha volado 37 veces. También tuvo fallos: el 1 de septiembre de 2016 uno explotó en la plataforma mientras cargaba combustible (Amos‑6), y en julio de 2024 falló una segunda etapa.</p><p>Las manchas oscuras de este modelo son hollín de la reentrada: así se ven los propulsores después de volar.</p>`,src:['wft','sland','pbs','upi','sfn']}),

  hist:`<p>Tres primeras etapas de Falcon 9 unidas. En su primer vuelo, el <b>6 de febrero de 2018</b>, llevó como carga de prueba un auto eléctrico rojo con un maniquí llamado «Starman», que hoy da vueltas alrededor del Sol. Los dos propulsores laterales aterrizaron al mismo tiempo, uno junto al otro.</p><p>Ha lanzado misiones científicas como la sonda Psyche (2023), Europa Clipper hacia Júpiter (2024) y el telescopio espacial Roman de la NASA (agosto de 2026).</p>`,src:['wfh','roman','rspace']}),

  hist:`<p>El cohete más grande y potente jamás construido, hecho para ser <b>totalmente reutilizable</b>. El primer vuelo, el 20 de abril de 2023, terminó en explosión; cada vuelo siguiente fue un paso más.</p><p>El <b>13 de octubre de 2024</b> (vuelo 5) la torre atrapó al propulsor con sus brazos, los «palillos», al volver del espacio. El 28 de septiembre de 2026 (vuelo 14) llegó por primera vez a órbita y soltó 26 satélites Starlink V3. Y en el vuelo 15, el 14 de noviembre de 2026, la torre atrapó por primera vez a la <b>nave</b> al regresar de órbita, después de 14 vueltas a la Tierra. En ese mismo vuelo el propulsor se quedó sin combustible para su captura y se destruyó sobre el Golfo de México.</p><p>Una versión de Starship será el módulo lunar del programa Artemis de la NASA. Todavía falta demostrar el reabastecimiento de combustible entre naves en órbita.</p>`,src:['wss','wssl','f5','f15','hls']}),

  hist:`<p>La torre no solo sostiene el cohete antes del despegue: sus dos brazos gigantes, apodados «palillos» (chopsticks), lo levantan para apilarlo y lo <b>atrapan en el aire</b> cuando vuelve. Así el propulsor no necesita patas de aterrizaje, que pesan, y queda listo para volver a apilarse.</p><p>Debajo está la mesa de lanzamiento, un anillo de acero sobre columnas donde se apoya el propulsor con sus 33 motores.</p>`,src:['npr','f15']}),

  hist:`<p>La primera nave privada en llevar astronautas a la Estación Espacial: Bob Behnken y Doug Hurley, el 30 de mayo de 2020 (Demo‑2). Desde entonces lleva tripulaciones de la NASA y misiones privadas: Inspiration4 (2021), la primera totalmente privada; Polaris Dawn (2024), que subió a unos 1.400 km e hizo la primera caminata espacial comercial; y Fram2 (2025), la primera tripulada que pasó sobre los polos.</p><p>Su escudo térmico es de <b>PICA‑X</b> (ver la pieza cercana) y vuelve al mar con 4 paracaídas.</p>`,src:['wd2','crew13']}),

 raptor:R({grp:'edificio',name:'Raptor 2 y Raptor 3',yrs:'2019–hoy',

  hist:`<p>El motor de Starship. Quema metano, que se podría fabricar en Marte con agua y dióxido de carbono. Usa el ciclo más complejo que existe: <b>todo</b> el combustible y todo el oxígeno pasan por turbinas antes de entrar a la cámara, lo que da muchísima presión.</p><p>Compara los dos modelos: el Raptor 2 (izquierda) tiene tuberías y sensores por fuera; el Raptor 3 (derecha) los lleva integrados en su propio cuerpo. Es más liviano, más potente y más fácil de fabricar.</p>`,src:['wrap']}),

{ const es=new THREE.Scene(); const s2=new Sky(); s2.scale.setScalar(15000); s2.material.uniforms.sunPosition.value.copy(sunDir); for(const k of['turbidity','rayleigh','mieCoefficient','mieDirectionalG']) s2.material.uniforms[k].value=su[k].value; es.add(s2); scene.environment=pmrem.fromScene(es).texture; }

const rnd=(()=>{ let s=7; return ()=>{ s=(s*16807)%2147483647; return s/2147483647; }; })();
function ctex(w,h,draw,{srgb=true,rep=[1,1]}={}){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); if(srgb) t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(...rep); t.anisotropy=8; return t; }
function normalFrom(w,h,hf,strength=2){ const H=new Float32Array(w*h); for(let y=0;y<h;y++)for(let x=0;x<w;x++) H[y*w+x]=hf(x,y);
  return ctex(w,h,(g)=>{ const im=g.createImageData(w,h); for(let y=0;y<h;y++)for(let x=0;x<w;x++){ const at=(a,b)=>H[((b+h)%h)*w+((a+w)%w)]; const dx=(at(x+1,y)-at(x-1,y))*strength, dy=(at(x,y+1)-at(x,y-1))*strength, l=Math.hypot(dx,dy,1), k=(y*w+x)*4;
    im.data[k]=(-dx/l*.5+.5)*255; im.data[k+1]=(-dy/l*.5+.5)*255; im.data[k+2]=(1/l*.5+.5)*255; im.data[k+3]=255; } g.putImageData(im,0,0); },{srgb:false}); }
const sandTex=ctex(512,512,(g,w,h)=>{ g.fillStyle='#c9b48e'; g.fillRect(0,0,w,h); for(let i=0;i<26000;i++){ const v=rnd(); g.fillStyle=`rgba(${150+v*90|0},${130+v*80|0},${95+v*60|0},.35)`; g.fillRect(rnd()*w,rnd()*h,1+rnd()*2,1+rnd()*2); }
  for(let i=0;i<40;i++){ const x=rnd()*w,y=rnd()*h,r=20+rnd()*90,gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,`rgba(${rnd()<.5?'120,105,80':'225,210,180'},.18)`); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2); } },{rep:[140,140]});
const concTex=ctex(512,512,(g,w,h)=>{ g.fillStyle='#a9a7a1'; g.fillRect(0,0,w,h); for(let i=0;i<14000;i++){ const v=rnd(); g.fillStyle=`rgba(${120+v*80|0},${120+v*78|0},${118+v*75|0},.25)`; g.fillRect(rnd()*w,rnd()*h,1.5,1.5); } g.strokeStyle='rgba(60,60,60,.35)'; g.lineWidth=2; g.strokeRect(0,0,w,h); },{rep:[60,60]});

const mesh=(g,m,parent,x=0,y=0,z=0,cast=true)=>{ const o=new THREE.Mesh(g,m); o.position.set(x,y,z); o.castShadow=cast; o.receiveShadow=true; parent&&parent.add(o); return o; };
const cyl=(r1,r2,h,m,parent,y,seg=48,open=false)=>mesh(new THREE.CylinderGeometry(r1,r2,h,seg,1,open),m,parent,0,y+h/2,0);

  const tw=mesh(new THREE.PlaneGeometry(34,10.6),new THREE.MeshBasicMaterial({map:tlTex}),hall,B.x0+.4,7,-140,false); tw.rotation.y=Math.PI/2; tag(tw,'timeline'); exhibit('timeline',-78,-140,[6,1.7,0]); }

/* ================= INTERFAZ ================= */
const NAME=k=>k.startsWith('tesla')?'Tesla '+TESLA[+k.slice(5)][0]:k==='hall'?'Galería Starfactory':INFO[k].name;
const idx=$('idx'); const groups=[['Cohetes (de izquierda a derecha)',['f1','v10','grass','v11','b5','fh','hop','sn15','ss','tower']],['Galería · entra caminando',['dragon','merlin','mvac','raptor','grid','sdraco','tiles','fairing','starlink','suits','asds','timeline']],['Estacionamiento · Tesla',TESLA.map((_,i)=>'tesla'+i)]];
idx.innerHTML=groups.map(([t,ks])=>`<h3>${t}</h3>`+ks.map(k=>`<button data-k="${k}"><span>${k.startsWith('tesla')?TESLA[+k.slice(5)][0]:INFO[k].name}</span><small>${k.startsWith('tesla')?TESLA[+k.slice(5)][1]:INFO[k].yrs.split(' ')[0]}</small></button>`).join('')).join('');
idx.onclick=e=>{ const b=e.target.closest('button'); if(b){ goTo(b.dataset.k); if(innerWidth<=900) idx.classList.remove('open'); } };
$('bIdx').onclick=()=>idx.classList.toggle('open');
const lblBox=$('lbl'); LBL.forEach(l=>{ const d=document.createElement('div'); d.className='lb'; const I=INFO[l.key]; d.innerHTML=l.text||(l.key==='hall'?'Galería Starfactory <small>entra caminando</small>':`${I.name}<small>${I.yrs.split(' ')[0]}</small>`); d.onclick=()=>{ if(l.key==='hall') enterHall(); else goTo(l.key); }; lblBox.appendChild(d); l.el=d; });
function showCard(k){ let kick,name,html;
  if(k.startsWith('tesla')){ const t=TESLA[+k.slice(5)]; kick='Tesla · '+t[1]; name=t[0]; html=`<p>${t[2]}</p><p class="note">Tesla fue fundada en 2003 por Martin Eberhard y Marc Tarpenning; Elon Musk fue el principal inversor desde 2004 y luego su director. Aquí ves la línea del tiempo de sus vehículos con sus datos; no incluimos modelos 3D de los autos porque sus diseños son obra protegida de la marca.</p><div class="src">Fuentes<ul>${[...t[3],'tsl'].map(s=>`<li><a href="${SRC[s][1]}" target="_blank" rel="noopener">${SRC[s][0]}</a></li>`).join('')}</ul></div>`; }
  else { const I=INFO[k]; kick=(I.grp==='cohete'?'Cohete · ':'Galería · ')+I.yrs; name=I.name;
    html=`<dl class="kv">${I.data.map(d=>`<dt>${d[0]}</dt><dd>${d[1]}</dd>`).join('')}</dl>${I.hist}${I.grp==='cohete'?'':`<button class="go" id="goWalk">🚶 Ir caminando hasta aquí</button>`}<div class="src">Fuentes<ul>${I.src.map(s=>`<li><a href="${SRC[s][1]}" target="_blank" rel="noopener">${SRC[s][0]}</a></li>`).join('')}</ul></div>`; }
  $('ck').textContent=kick; $('cn').textContent=name; $('cb').innerHTML=html; $('cb').scrollTop=0; $('card').hidden=false;
  const gw=$('goWalk'); if(gw) gw.onclick=()=>walkTo(k);
  idx.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.k===k));
  try{ history.replaceState(null,'','#'+k); }catch(e){} }
$('cx').onclick=()=>{ $('card').hidden=true; };

/* ================= CÁMARA: dron y caminar ================= */
let mode='drone', fly=null;
const W={pos:V3(-40,1.7,-60),yaw:Math.PI,pitch:0,keys:{},run:false};
function setMode(m){ mode=m; $('bDrone').setAttribute('aria-pressed',m==='drone'); $('bWalk').setAttribute('aria-pressed',m==='walk'); controls.enabled=m==='drone'; $('pad').hidden=m!=='walk'; $('cross').hidden=m!=='walk';
  $('hint').textContent=m==='walk'?'W A S D o flechas para caminar · arrastra para mirar · Shift para correr · toca una pieza':'Arrastra para girar · toca un cohete o una etiqueta para ver su historia';
  if(m==='walk'){ fly=null; camera.position.copy(W.pos); } }
function droneTo(target,dist,elev=.25,az=0){ const dir=V3(Math.sin(az),elev,Math.cos(az)).normalize(); fly={t:0,p0:camera.position.clone(),t0:controls.target.clone(),p1:target.clone().add(dir.multiplyScalar(dist)),t1:target.clone()}; }
function goTo(k){ showCard(k); const r=ROCK.find(o=>o.key===k);
  if(r){ setMode('drone'); const c=r.center||V3(r.g.position.x,r.h*.5,0); const mob=innerWidth<700; if(mob) c.y-=r.h*.22; droneTo(c,Math.max(30,r.h*1.15)*(mob?2.3:1),.18,k==='tower'?.5:0); return; }
  walkTo(k); }
function walkTo(k){ const e=EX[k]; if(!e) return; setMode('walk'); const v=e.view; W.pos.set(e.pos.x+v[0],1.7,e.pos.z+v[2]); const look=V3(e.pos.x,v[1],e.pos.z); const d=look.clone().sub(W.pos); W.yaw=Math.atan2(-d.x,-d.z); W.pitch=Math.atan2(d.y,Math.hypot(d.x,d.z))*.6; camera.position.copy(W.pos); }
function enterHall(){ setMode('walk'); W.pos.set(-40,1.7,-121); W.yaw=0; W.pitch=.05; $('card').hidden=true; }
$('bDrone').onclick=()=>{ setMode('drone'); droneTo(V3(-20,30,-30),260,.35); };
$('bWalk').onclick=()=>{ if(mode!=='walk'){ W.pos.set(-30,1.7,30); W.yaw=0; W.pitch=.25; setMode('walk'); } };
$('bIn').onclick=enterHall;
addEventListener('keydown',e=>{ W.keys[e.key.toLowerCase()]=true; if(e.key==='Shift') W.run=true; });
addEventListener('keyup',e=>{ W.keys[e.key.toLowerCase()]=false; if(e.key==='Shift') W.run=false; });
$('pad').querySelectorAll('button').forEach(b=>{ const k=b.dataset.k; const on=v=>e=>{ e.preventDefault(); if(k==='run'){ if(v) { W.run=!W.run; b.setAttribute('aria-pressed',W.run); } return; } W.keys['pad'+k]=v; };
  b.addEventListener('pointerdown',on(true)); b.addEventListener('pointerup',on(false)); b.addEventListener('pointerleave',on(false)); b.addEventListener('pointercancel',on(false)); });
let drag=null;
canvas.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY}; if(mode==='walk') canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(!drag||mode!=='walk') return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY; W.yaw-=dx*.0045; W.pitch=THREE.MathUtils.clamp(W.pitch-dy*.0045,-1.2,1.2); });
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
canvas.addEventListener('pointerup',e=>{ if(!drag) return; const moved=Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0); drag=null; if(moved>6) return;
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc,camera); ray.far=mode==='walk'?60:3000;
  const hits=ray.intersectObjects(scene.children,true).filter(h=>!h.object.userData.glass&&h.object!==sky);
  const h=hits[0]; if(h&&h.object.userData.key){ const k=h.object.userData.key; if(mode==='walk') showCard(k); else goTo(k); } });
// colisiones: paredes de la galería (con la puerta abierta)
function blocked(p){ const m=.5; const inX=p.x>B.x0-m&&p.x<B.x1+m, inZ=p.z>B.z0-m&&p.z<B.z1+m; if(!inX||!inZ) return false;
  const nearW=p.x<B.x0+m||p.x>B.x1-m||p.z<B.z0+m; const nearF=p.z>B.z1-m; if(nearW) return true; if(nearF) return !(p.x>B.door[0]+.6&&p.x<B.door[1]-.6); return false; }
function stepWalk(dt){ const f=(W.keys.w||W.keys.arrowup||W.keys.padf?1:0)-(W.keys.s||W.keys.arrowdown||W.keys.padb?1:0), s=(W.keys.d||W.keys.arrowright||W.keys.padr?1:0)-(W.keys.a||W.keys.arrowleft||W.keys.padl?1:0);
  const sp=(W.run?11:4)*dt, fw=V3(-Math.sin(W.yaw),0,-Math.cos(W.yaw)), rt=V3(Math.cos(W.yaw),0,-Math.sin(W.yaw));
  const mv=fw.multiplyScalar(f*sp).add(rt.multiplyScalar(s*sp)); const nx=W.pos.clone(); nx.x+=mv.x; if(!blocked(nx)) W.pos.x=nx.x; const nz=W.pos.clone(); nz.z+=mv.z; if(!blocked(nz)) W.pos.z=nz.z;
  camera.position.copy(W.pos); camera.rotation.set(W.pitch,W.yaw,0,'YXZ'); }

function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
const clock=new THREE.Clock(), tmp=V3();
function tick(){ const raw=clock.getDelta(), dt=Math.min(.05,raw);
  if(mode==='drone'){ if(fly){ fly.t=Math.min(1,fly.t+Math.min(raw,.5)/1.6); const k=fly.t*fly.t*(3-2*fly.t); camera.position.lerpVectors(fly.p0,fly.p1,k); controls.target.lerpVectors(fly.t0,fly.t1,k); if(fly.t>=1) fly=null; } controls.update(); }
  else stepWalk(dt);
  renderer.render(scene,camera);
  const w=innerWidth,h=innerHeight, inHall=mode==='walk'&&W.pos.z<B.z1&&W.pos.z>B.z0&&W.pos.x>B.x0&&W.pos.x<B.x1;
  for(const l of LBL){ tmp.copy(l.pos).project(camera); const d=camera.position.distanceTo(l.pos); const vis=tmp.z<1&&Math.abs(tmp.x)<1.1&&Math.abs(tmp.y)<1.1&&!inHall&&(mode==='drone'||d<160);
    l.el.style.display=vis?'':'none'; if(vis) l.el.style.transform=`translate(${(tmp.x*.5+.5)*w}px,${(-tmp.y*.5+.5)*h}px) translate(-50%,-100%)`; }
  requestAnimationFrame(tick); }
camera.position.set(60,60,260); controls.target.set(-20,35,-20);
$('load').hidden=true;
const hk=location.hash.slice(1); if(hk&&(INFO[hk]||hk.startsWith('tesla'))) goTo(hk); else droneTo(V3(-20,32,-20),250,.32,.15);
tick();
