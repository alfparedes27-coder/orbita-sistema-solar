<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Simulador Dragon Lunar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Diseño: lienzo 3D a pantalla completa; HUD flotante: barra de misión arriba, tarjeta del tutorial abajo, avisos al centro. Paleta oscura única (cabina espacial), tomada del proyecto Órbita Sistema Solar 3D. */
:root{
  --void:#04060c; --panel:rgba(9,13,22,.86); --panel-solid:#0b101b; --line:#1e2940; --line-strong:#2d3c5a;
  --ink:#e8ecf4; --dim:#8d99b0; --faint:#5c6884;
  --craft:#6fd3ff; --craft-ink:#04121a; --sol:#ffb547; --ok:#7ee2a8; --warn:#ffcf6b; --bad:#ff8a7a;
  --f-display:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --gl:max(16px, env(safe-area-inset-left,0px)); --gr:max(16px, env(safe-area-inset-right,0px));
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--void);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:0}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:grab;outline:none}
#gl:active{cursor:grabbing}
.bar{position:fixed;top:calc(10px + var(--top));left:var(--gl);right:var(--gr);display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5;flex-wrap:wrap}
.bar>*{pointer-events:auto}
.mission{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px 9px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-width:0}
.ph{font:600 11px/1.2 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--craft)}
.clk{font:500 22px/1.2 var(--f-data);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.hold{font:500 11px/1.3 var(--f-data);color:var(--warn);letter-spacing:.08em;min-height:14px}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:100%}
.btn{font:500 13px/1 var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:0 12px;min-height:36px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}
.btn:hover{border-color:var(--craft)}
.btn:focus-visible{outline:2px solid var(--craft);outline-offset:2px}
.btn.on{background:#0e2a38;border-color:var(--craft);color:#dff6ff}
.btn.primary{background:var(--craft);color:var(--craft-ink);border-color:var(--craft);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.warp{display:flex;gap:4px;align-items:center}
.warp span{font:500 11px var(--f-data);color:var(--dim);margin-right:2px}
.warp .btn{min-height:30px;padding:0 9px;font-family:var(--f-data);font-size:12px}
#card{position:fixed;left:var(--gl);bottom:calc(14px + var(--bot));width:min(400px, calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px 14px;z-index:6;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 150px);overflow:auto}
.card-head{display:flex;align-items:center;gap:8px}
.stepn{font:500 11px var(--f-data);color:var(--dim);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.tag{font:600 10px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;padding:4px 7px;border-radius:999px;border:1px solid}
.tag.real{color:var(--ok);border-color:rgba(126,226,168,.45)}
.tag.simp{color:var(--warn);border-color:rgba(255,207,107,.45)}
.tag.hipo{color:var(--sol);border-color:rgba(255,181,71,.5)}
.collapse{margin-left:auto;min-height:28px;padding:0 10px;font-size:12px}
#card h2{margin:0;font:600 21px/1.2 var(--f-display);letter-spacing:.01em;text-wrap:balance}
#card p{margin:0;line-height:1.5;color:#cfd6e4}
.status{font:500 12px/1.4 var(--f-data);color:var(--craft);font-variant-numeric:tabular-nums}
.fact{border-top:1px solid var(--line);padding-top:8px;font-size:13px;color:var(--dim)!important}
.fact b{font:600 10px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-right:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
#card.min .body{display:none}
.body{display:flex;flex-direction:column;gap:8px}
#callout{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:4;opacity:0;transition:opacity .5s;width:min(92vw,700px)}
#callout.show{opacity:1}
#callout .big{font:600 clamp(28px,6vw,54px)/1.05 var(--f-display);letter-spacing:.12em;text-transform:uppercase;text-shadow:0 2px 24px rgba(0,0,0,.8)}
#callout .sub{font:500 14px/1.4 var(--f-data);color:var(--craft);margin-top:8px;text-shadow:0 1px 10px #000}
#toast{position:fixed;left:50%;top:calc(96px + var(--top));transform:translateX(-50%);background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:10px;padding:10px 14px;max-width:min(90vw,520px);font-size:13px;line-height:1.45;z-index:7;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s;z-index:8}
#tag3d{position:fixed;left:0;top:0;z-index:3;pointer-events:none;font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);white-space:nowrap;transform:translate(14px,-50%)}
#tag3d::before{content:"";position:absolute;left:-14px;top:50%;width:10px;height:10px;margin-top:-5px;border:2px solid var(--craft);border-radius:50%;animation:ping 1.4s infinite}
#tag3d span{display:block;font:500 11px var(--f-data);letter-spacing:.02em;text-transform:none;color:var(--craft)}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.8);opacity:0}}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--void);z-index:9;font:500 13px var(--f-data);color:var(--dim);letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:24px}
@media (max-width:640px){
  .clk{font-size:18px}
  #card{padding:12px 14px}
  #card h2{font-size:18px}
  .tools .btn{min-height:32px;padding:0 9px;font-size:12px}
  #callout{top:34%}
}
@media (prefers-reduced-motion:reduce){#tag3d::before{animation:none}#callout,#toast,#fade{transition:none}}
</style>

</head>

    <div class="ph" id="phase">Plataforma · Puerto Santa Ana</div>
    <div class="clk" id="clock">T−00:46:00</div>
    <div class="hold" id="hold"></div>
  </div>
  <div class="tools">

      <button class="btn" data-w="1">×1</button><button class="btn" data-w="5">×5</button><button class="btn" data-w="20">×20</button>

    <button class="btn" id="bView" hidden>Vista exterior</button>
    <button class="btn" id="bSound" hidden>Sonido: sí</button>
    <button class="btn" id="bQual">Calidad: alta</button>
    <button class="btn" id="bReset">Reiniciar</button>

</div>

<section id="card" aria-live="polite">
  <div class="card-head">
    <span class="stepn" id="stepn">Escenario</span>
    <span class="tag hipo" id="tag">Hipotético</span>
    <button class="btn collapse" id="bMin" aria-label="Minimizar tutorial">Ocultar</button>
  </div>
  <div class="body">
    <h2 id="stitle">Falcon Heavy en Puerto Santa Ana</h2>
    <p id="stext"></p>
    <div class="status" id="sstatus"></div>
    <p class="fact" id="sfact"></p>
    <div class="row">
      <button class="btn" id="bWhere" hidden>Mostrar dónde</button>
      <button class="btn primary" id="bNext">Subir a la Dragon</button>
    </div>
  </div>
</section>

<div id="callout"><div class="big" id="cBig"></div><div class="sub" id="cSub"></div></div>
<div id="toast"></div>
<div id="tag3d" hidden>Crew Dragon<span>toca para subir a bordo</span></div>
<div id="fade"></div>
<div id="loading">Preparando la plataforma…</div>

  const burnSide=t>=T.IGN&&t<T.BECO, burnCore=t>=T.IGN&&t<T.MECO;
  const fl=.9+.1*Math.sin(NOW*47)+.06*Math.sin(NOW*31);
  const spool=t<0?clamp((t-T.IGN)/2.5,.15,1):1;
  const wide=1+s.alt*.12, grow=(1+s.alt*.5)*spool;
  for(const [p,on] of [[plL,burnSide],[plR,burnSide],[plC,burnCore]]){ p.visible=on; p.scale.set(fl*wide,grow*fl,fl*wide); for(const m of p.userData.mats){m.uniforms.time.value=NOW;} }
  engLight.intensity= burnCore? 9*spool*fl*(1-smooth(2,20,s.alt)) : 0;
  if(!sep.side&&t>=T.SIDESEP){sep.side=true;const v=new THREE.Vector3(Math.cos(s.gamma),Math.sin(s.gamma),0).multiplyScalar(s.v*1000);
    detach(sideL,v.clone().add(new THREE.Vector3(0,0,-18)));detach(sideR,v.clone().add(new THREE.Vector3(0,0,18)));}
  if(!sep.core&&t>=T.STAGESEP){sep.core=true;const v=new THREE.Vector3(Math.cos(s.gamma),Math.sin(s.gamma),0).multiplyScalar(s.v*1000-6);detach(stage1,v);}
  for(const d of detached){d.age+=dt;d.vel.y-=9.81*dt*.6;d.obj.position.addScaledVector(d.vel,dt);d.obj.rotation.z+=d.spin*dt;if(d.age>40)d.obj.visible=false;}
  // nube de escape en la plataforma, iluminada por los motores
  if(t>T.IGN-.3&&t<16){for(let i=0;i<7;i++){const a=Math.random()*Math.PI*2,sp=18+Math.random()*50;emit(smoke,[Math.cos(a)*5,2,Math.sin(a)*5+10],[Math.cos(a)*sp,3+Math.random()*9,Math.sin(a)*sp*.6+16]);}}
  const su=smoke.material.uniforms; su.opacity.value=t<T.IGN?0:.9*(1-smooth(40,140,t));
  glowCol.setRGB(2.4,1.05,.35).multiplyScalar(burnCore?(1-smooth(4,30,t))*fl:0); su.glow.value.copy(glowCol);
  su.scale.value=innerHeight*renderer.getPixelRatio()/(2*Math.tan(gcam.fov*D2R/2));
  stepPuffs(smoke,dt,.22);
  if(t>-2100&&t<T.IGN&&Math.random()<.6){const side=Math.random()<.5?-1:1;emit(vent,[side*1.9,30+Math.random()*16,(Math.random()-.5)*2],[side*(1.2+Math.random()),-1.2-Math.random(),(Math.random()-.5)]);}
  const vu=vent.material.uniforms; vu.opacity.value=t>-2100&&t<20?.75:0; vu.scale.value=su.scale.value; stepPuffs(vent,dt*Math.min(S.lastWarp||1,3),.05);
}
function updateGroundCam(dt){
  if(S.groundAnim&&!S.boarded) return;
  const t=S.t;
  if(S.boarded&&t>=T.IGN){
    const tgt=fh.position.clone().add(new THREE.Vector3(0,34,0).applyEuler(fh.rotation));
    gcam.position.set(-700,30,1500); const dist=gcam.position.distanceTo(tgt);
    gcam.fov=clamp(2*Math.atan(70/dist)/D2R*1.6,.5,45); gcam.updateProjectionMatrix(); gcam.lookAt(tgt);
    if(t<25){const a=.002*(1-smooth(5,25,t))*gcam.fov;gcam.rotation.x+=(Math.random()-.5)*a;gcam.rotation.y+=(Math.random()-.5)*a;}
    return;
  }
  if(gcam.fov!==45){gcam.fov=45;gcam.updateProjectionMatrix();}
  const {th,ph,d,tgt}=orbitG; gcam.position.set(tgt.x+d*Math.sin(ph)*Math.sin(th),tgt.y+d*Math.cos(ph),tgt.z+d*Math.sin(ph)*Math.cos(th));
  if(gcam.position.y<2)gcam.position.y=2; gcam.lookAt(tgt);
}
let frustMode='';
function updatePlush(dt){
  const t=S.t, s=mstate(t), P=plush;
  const g= t<T.IGN ? 1 : (t<T.SECO1 ? s.g : (t>=T.TLI&&t<T.SECO2 ? s.g : 0));
  gLocal.set(0,-9.81*g,0);
  P.vel.addScaledVector(gLocal,dt);
  if(g<.05){P.vel.x+=(Math.random()-.5)*.03*dt;P.vel.y+=(Math.random()-.5)*.03*dt+.004*dt;P.vel.z+=(Math.random()-.5)*.03*dt;}
  if(t>=T.IGN&&t<T.SECO1) P.vel.addScaledVector(tmpV.set(Math.random()-.5,0,Math.random()-.5),.4*dt*(t<T.MAXQ?3:1));
  P.vel.multiplyScalar(Math.exp(-(g<.05?.15:1.6)*dt));
  P.pos.addScaledVector(P.vel,dt);
  const d=tmpV.copy(P.pos).sub(P.anchor); const L=d.length();
  if(L>P.L){d.multiplyScalar(1/L);P.pos.copy(P.anchor).addScaledVector(d,P.L);const vr=P.vel.dot(d);if(vr>0)P.vel.addScaledVector(d,-vr);}
  P.g.position.copy(P.pos);
  if(g>.05){const up=tmpV.copy(P.anchor).sub(P.pos).normalize();P.g.quaternion.slerp(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),up),Math.min(1,dt*3));}
  else{P.g.rotation.x+=dt*.15;P.g.rotation.z+=dt*.09;}
  const head=new THREE.Vector3(0,.11,0).applyQuaternion(P.g.quaternion).add(P.pos);
  const pa=P.line.geometry.attributes.position; pa.setXYZ(0,P.anchor.x,P.anchor.y,P.anchor.z); pa.setXYZ(1,head.x,head.y,head.z); pa.needsUpdate=true;
}
function updateSpace(dt){
  const t=S.t, s=mstate(t);
  // Orientación de la nave: la cabina queda fija y el universo gira a su alrededor (craftQ⁻¹)
  if(S.attMode==='flight') flightQuat(t,craftQ);
  else if(S.attMode==='slew'||S.attMode==='game') craftQ.copy(G.q);
  else { targetQuat(t,qTmp); craftQ.slerp(qTmp,Math.min(1,dt*1.5)); }
  farRoot.quaternion.copy(craftQ).invert();
  sunDirL.copy(sunDir).applyQuaternion(farRoot.quaternion);
  // Tierra, nubes y Luna
  const ep=earthPos(t,new THREE.Vector3()); earth.position.copy(ep); atmo.position.copy(ep);
  earth.quaternion.setFromAxisAngle(new THREE.Vector3(0,0,1),s.theta).multiply(earthQ0);
  earthMat.uniforms.cOff.value=(t%864000)*2e-7;
  moon.position.copy(ep).addScaledVector(uM,DM*1000);
  const ab=smooth(0,60,s.alt); skyCol.lerpColors(skyLow,black,ab); far.background=skyCol;
  stars.material.uniforms.op.value=smooth(25,90,s.alt); stars.material.uniforms.pr.value=renderer.getPixelRatio();
  atmo.visible=s.alt>35; sun.material.opacity=.3+.7*ab;
  // Luz del Sol (atenuada y cálida en la plataforma, blanca e intensa en el espacio) y luz reflejada por la Tierra
  sunLight.color.lerpColors(duskCol,spaceCol,ab); sunLight.intensity=lerp(1.6,6.5,ab);
  hemiN.position.copy(ep).negate().applyQuaternion(farRoot.quaternion).normalize(); hemiN.color.lerpColors(hemiSkyPad,hemiSkySpace,ab); hemiN.intensity=lerp(.5,.35,ab);
  const fm=S.view==='cabin'?'c':'e';
  if(fm!==frustMode){frustMode=fm; if(fm==='c'){setSunFrustum(2.4,12);near.environment=envCabin;} else {setSunFrustum(20,70);near.environment=envSpace;}}
  sunLight.position.copy(sunDirL).multiplyScalar(sunLight.userData.dist); sunLight.target.position.set(0,fm==='c'?0:-6,0);
  // Modelo exterior
  const F=S.flags;
  ext.hinge.rotation.x += ((F.nose?-1.9:0)-ext.hinge.rotation.x)*Math.min(1,dt*1.2);
  const firing=(t>=T.SES1&&t<T.SECO1)||(t>=T.TLI&&t<T.SECO2);
  ext.plume.visible=firing; for(const m of ext.plume.userData.mats) m.uniforms.time.value=NOW;
  ext.nozMat.emissiveIntensity+=((firing?2.2:0)-ext.nozMat.emissiveIntensity)*Math.min(1,dt*.6);
  if(F.sep){ const age=Math.min(t-S.sepT,600); ext.s2.position.y=-age*.35; ext.s2.visible=age<300; }
  // vibración de la cabina durante el ascenso
  let sh=0; if(t>=T.IGN&&t<T.SECO1){sh= t<0?.004 : t<T.MAXQ? .006+.008*smooth(30,66,t) : t<T.MECO? .006 : t<T.SES1? 0 : .002;} else if(t>=T.TLI&&t<T.SECO2) sh=.0015;
  cam.position.copy(camHome).add(new THREE.Vector3((Math.random()-.5)*sh,(Math.random()-.5)*sh,(Math.random()-.5)*sh));
  // botones físicos y peluche
  for(const b of buttons){ if(b.openT>0){b.openT-=dt;if(b.openT<=0)b.open=false;} if(b.cover){b.cover.rotation.x+=((b.open?-1.9:0)-b.cover.rotation.x)*Math.min(1,dt*10);} b.press=Math.max(0,b.press-dt); b.cap.position.z=b.z0-(b.press>0?.007:0); }
  if(ringMesh.visible){const k=1+.25*Math.sin(NOW*5);ringMesh.scale.setScalar(k);ringMesh.material.opacity=.55+.45*Math.sin(NOW*5);}
  if(S.view==='cabin') updatePlush(dt);
  // cámaras
  if(lookAnim){lookAnim.t=Math.min(1,lookAnim.t+dt*1.6);const k=smooth(0,1,lookAnim.t);S.yaw=lerp(lookAnim.y0,lookAnim.y1,k);S.pitch=lerp(lookAnim.p0,lookAnim.p1,k);if(lookAnim.t>=1)lookAnim=null;}
  aimCabinCam();
  const asp=innerWidth/innerHeight; const vfov=clamp(2*Math.atan(Math.tan(40*D2R)/asp)/D2R,62,108);
  cam.fov=vfov*S.zoom; cam.aspect=asp; cam.updateProjectionMatrix();
  const {th,ph,d}=orbitE; const qi=farRoot.quaternion;
  ecam.position.set(d*Math.sin(ph)*Math.sin(th),d*Math.cos(ph),d*Math.sin(ph)*Math.cos(th)).applyQuaternion(qi).add(tmpV.set(0,-4,0));
  ecam.up.set(0,1,0).applyQuaternion(qi); ecam.lookAt(0,-4,0);
}
resize();
applyQuality();
let screenAcc=0;
function frame(){
  const dt=Math.min(clock.getDelta(),.1); NOW+=dt;
  if(EMB.slave){ if(EMB.playing) EMB.t+=dt*EMB.rate; S.t=EMB.t; catchUp(); const tk=S.t; tick(dt); S.t=tk; S.lastWarp=EMB.playing?EMB.rate:0; }
  else { const t0=S.t; tick(dt); S.lastWarp=dt>0?(S.t-t0)/dt:1; }
  updateGround(dt); updateGroundCam(dt); updateSpace(dt); audioUpdate(); hud(dt);
  const useGround=!S.boarded||(S.view==='ext'&&S.t<T.SES1);
  cabin.visible=!useGround&&S.view==='cabin'; extModel.visible=!useGround&&S.view==='ext';
  if(EMB.hidden){ requestAnimationFrame(frame); return; }
  if(isCabinView()){ screenAcc+=dt; if(screenAcc>1/20){screenAcc=0;drawLeft();drawCenter();drawRight();} }
  const tag=$('#tag3d');
  if(!S.boarded&&!S.boarding){const p=fh.userData.dragon.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(2.2,2.5,0)).project(gcam);
    tag.hidden=p.z>1; tag.style.left=((p.x+1)/2*innerWidth)+'px'; tag.style.top=((1-p.y)/2*innerHeight)+'px';}
  rpGround.enabled=useGround; rpFar.enabled=rpNear.enabled=!useGround;
  if(!useGround){ const c=S.view==='cabin'?cam:ecam; rpNear.camera=c; near.updateMatrixWorld(); c.updateMatrixWorld(); c.getWorldPosition(fcam.position); c.getWorldQuaternion(fcam.quaternion); fcam.fov=c.fov; fcam.aspect=innerWidth/innerHeight; fcam.updateProjectionMatrix(); }
  renderer.toneMappingExposure= useGround ? .5 : (S.view==='cabin' ? 1.2 : .85);
  bloom.strength= useGround ? .5 : (S.view==='cabin' ? .12 : .4); bloom.threshold= S.view==='cabin'&&!useGround ? 1.2 : .92;
  grade.uniforms.time.value=NOW;
  composer.render(dt);
  requestAnimationFrame(frame);
}
setCard();
drawLeft();
drawCenter();
drawRight();
$('#loading').remove();
if(EMB.on){
  $('#bReset').hidden=true;
  addEventListener('message',e=>{const d=e.data; if(!d||d.src!=='puerto'||d.type!=='sync') return;
    EMB.hidden=!!d.hidden; EMB.tel=d.tel||null; EMB.rate=d.rate||1; EMB.playing=!!d.playing;
    if(d.mode==='slave'){ EMB.t=d.t; if(!EMB.slave){EMB.slave=true;S.t=d.t;} } else EMB.slave=false;
    if(d.board&&!S.boarded) board();
  });
  setInterval(()=>{try{parent.postMessage({src:'dragon',type:'state',t:S.t,holding:S.holding,boarded:S.boarded},'*');}catch(e){}},100);
  setTimeout(()=>{if(!S.boarded) board();},250);
}
requestAnimationFrame(frame);
</script>
