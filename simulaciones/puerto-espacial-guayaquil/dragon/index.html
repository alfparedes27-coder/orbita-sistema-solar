<head>

<title>Simulador Dragon Lunar</title>

<style>
/* Diseño: lienzo 3D a pantalla completa; HUD flotante: barra de misión arriba, tarjeta del tutorial abajo, avisos al centro. Paleta oscura única (cabina espacial), tomada del proyecto Órbita Sistema Solar 3D. */
:root{
  --void:#04060c; --panel:rgba(9,13,22,.86); --panel-solid:#0b101b; --line:#1e2940; --line-strong:#2d3c5a;
  --ink:#e8ecf4; --dim:#8d99b0; --faint:#5c6884;
  --craft:#6fd3ff; --craft-ink:#04121a; --sol:#ffb547; --ok:#7ee2a8; --warn:#ffcf6b; --bad:#ff8a7a;
  --f-display:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --gl:max(16px, env(safe-area-inset-left,0px)); --gr:max(16px, env(safe-area-inset-right,0px));
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--void);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:0}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:grab;outline:none}
#gl:active{cursor:grabbing}
.bar{position:fixed;top:calc(10px + var(--top));left:var(--gl);right:var(--gr);display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5;flex-wrap:wrap}
.bar>*{pointer-events:auto}
.mission{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px 9px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-width:0}
.ph{font:600 11px/1.2 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--craft)}
.clk{font:500 22px/1.2 var(--f-data);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.hold{font:500 11px/1.3 var(--f-data);color:var(--warn);letter-spacing:.08em;min-height:14px}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:100%}
.btn{font:500 13px/1 var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:0 12px;min-height:36px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}
.btn:hover{border-color:var(--craft)}
.btn:focus-visible{outline:2px solid var(--craft);outline-offset:2px}
.btn.on{background:#0e2a38;border-color:var(--craft);color:#dff6ff}
.btn.primary{background:var(--craft);color:var(--craft-ink);border-color:var(--craft);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.warp{display:flex;gap:4px;align-items:center}
.warp span{font:500 11px var(--f-data);color:var(--dim);margin-right:2px}
.warp .btn{min-height:30px;padding:0 9px;font-family:var(--f-data);font-size:12px}
#card{position:fixed;left:var(--gl);bottom:calc(14px + var(--bot));width:min(400px, calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px 14px;z-index:6;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 150px);overflow:auto}
.card-head{display:flex;align-items:center;gap:8px}
.stepn{font:500 11px var(--f-data);color:var(--dim);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.tag{font:600 10px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;padding:4px 7px;border-radius:999px;border:1px solid}
.tag.real{color:var(--ok);border-color:rgba(126,226,168,.45)}
.tag.simp{color:var(--warn);border-color:rgba(255,207,107,.45)}
.tag.hipo{color:var(--sol);border-color:rgba(255,181,71,.5)}
.collapse{margin-left:auto;min-height:28px;padding:0 10px;font-size:12px}
#card h2{margin:0;font:600 21px/1.2 var(--f-display);letter-spacing:.01em;text-wrap:balance}
#card p{margin:0;line-height:1.5;color:#cfd6e4}
.status{font:500 12px/1.4 var(--f-data);color:var(--craft);font-variant-numeric:tabular-nums}
.fact{border-top:1px solid var(--line);padding-top:8px;font-size:13px;color:var(--dim)!important}
.fact b{font:600 10px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-right:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
#card.min .body{display:none}
.body{display:flex;flex-direction:column;gap:8px}
#callout{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:4;opacity:0;transition:opacity .5s;width:min(92vw,700px)}
#callout.show{opacity:1}
#callout .big{font:600 clamp(28px,6vw,54px)/1.05 var(--f-display);letter-spacing:.12em;text-transform:uppercase;text-shadow:0 2px 24px rgba(0,0,0,.8)}
#callout .sub{font:500 14px/1.4 var(--f-data);color:var(--craft);margin-top:8px;text-shadow:0 1px 10px #000}
#toast{position:fixed;left:50%;top:calc(96px + var(--top));transform:translateX(-50%);background:var(--panel-solid);border:1px solid var(--line-strong);border-radius:10px;padding:10px 14px;max-width:min(90vw,520px);font-size:13px;line-height:1.45;z-index:7;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s;z-index:8}
#tag3d{position:fixed;left:0;top:0;z-index:3;pointer-events:none;font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);white-space:nowrap;transform:translate(14px,-50%)}
#tag3d::before{content:"";position:absolute;left:-14px;top:50%;width:10px;height:10px;margin-top:-5px;border:2px solid var(--craft);border-radius:50%;animation:ping 1.4s infinite}
#tag3d span{display:block;font:500 11px var(--f-data);letter-spacing:.02em;text-transform:none;color:var(--craft)}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.8);opacity:0}}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--void);z-index:9;font:500 13px var(--f-data);color:var(--dim);letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:24px}
@media (max-width:640px){
  .clk{font-size:18px}
  #card{padding:12px 14px}
  #card h2{font-size:18px}
  .tools .btn{min-height:32px;padding:0 9px;font-size:12px}
  #callout{top:34%}
}
@media (prefers-reduced-motion:reduce){#tag3d::before{animation:none}#callout,#toast,#fade{transition:none}}
</style>

</head>

<section id="card" aria-live="polite">

    <button class="btn collapse" id="bMin" aria-label="Minimizar tutorial">Ocultar</button>

    <h2 id="stitle">Falcon Heavy en Puerto Santa Ana</h2>
    <p id="stext"></p>
    <div class="status" id="sstatus"></div>
    <p class="fact" id="sfact"></p>
    <div class="row">
      <button class="btn" id="bWhere" hidden>Mostrar dónde</button>
      <button class="btn primary" id="bNext">Subir a la Dragon</button>
    </div>
  </div>
</section>

<div id="callout"><div class="big" id="cBig"></div><div class="sub" id="cSub"></div></div>
<div id="toast"></div>
<div id="tag3d" hidden>Crew Dragon<span>toca para subir a bordo</span></div>
<div id="fade"></div>
<div id="loading">Preparando la plataforma…</div>

<script type="module">
import * as THREE from 'three';

const EARTH_DAY='../../tex/tierra-dia.webp', EARTH_NIGHT='../../tex/tierra-noche.webp', EARTH_SPEC='../../tex/tierra-brillo.webp', EARTH_CLOUDS='../../tex/nubes.webp', MOON_URI='../../tex/luna.jpg', WATER_URI='../../tex/agua.webp';

const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const D2R=Math.PI/180;
const FD='"Jost","Futura","Century Gothic",sans-serif';
const FM='"IBM Plex Mono",ui-monospace,Menlo,monospace';

/* =========================================================
   1. FÍSICA Y CRONOLOGÍA DE LA MISIÓN
   ========================================================= */
const RE=6371, RM=1737.4, DM=384400, MU_E=398600.4418, MU_M=4902.8;
// Tiempos (s desde T-0). Ascenso: aproximados del vuelo de prueba de Falcon Heavy (6 feb 2018).
const T={IGN:-3,MAXQ:66,BECO:149,SIDESEP:153,MECO:184,STAGESEP:187,SES1:195,SECO1:511,TLI:2400,SECO2:2730};
// Modo integrado (dentro del Puerto Espacial Guayaquil): el puerto manda el reloj y los tiempos de sus eventos
const EMB=(()=>{const q=new URLSearchParams(location.search);let tm=null;try{tm=JSON.parse(q.get('t')||'null');}catch(e){}
  return {on:q.has('embed'),slave:false,t:0,rate:1,playing:false,tel:null,hidden:false,tm};})();
if(EMB.tm) for(const k in EMB.tm) if(k in T && Number.isFinite(EMB.tm[k])) T[k]=EMB.tm[k];
// [t s, altitud km, distancia recorrida km, velocidad km/s] — perfil aproximado
const ASC=[[0,0,0,0],[20,.6,0,.07],[40,3,.3,.2],[66,11,2.5,.45],[100,28,10,.9],[149,58,35,1.75],[153,60,38,1.74],[184,80,62,2.4],[195,88,70,2.36],[260,125,140,3.1],[340,160,300,4.3],[420,185,520,5.8],[511,200,800,7.79]];
function ascAt(t){
  t=clamp(t,0,511);
  for(let i=1;i<ASC.length;i++){
    if(t<=ASC[i][0]){const a=ASC[i-1],b=ASC[i],u=(t-a[0])/(b[0]-a[0]);return [lerp(a[1],b[1],u),lerp(a[2],b[2],u),lerp(a[3],b[3],u)];}
  }
  const l=ASC[ASC.length-1];return [l[1],l[2],l[3]];
}
// Crucero translunar: integración radial RK4 con gravedad de la Tierra y de la Luna
const COAST=(()=>{
  const dt=20, rEnd=DM-RM-130, acc=r=>-MU_E/(r*r)+MU_M/((DM-r)*(DM-r));
  let r=6578, v=10.92, t=0; const ts=[0], rs=[r], vs=[v];
  while(r<rEnd && t<6e5){
    const k1r=v,k1v=acc(r),k2r=v+k1v*dt/2,k2v=acc(r+k1r*dt/2),k3r=v+k2v*dt/2,k3v=acc(r+k2r*dt/2),k4r=v+k3v*dt,k4v=acc(r+k3r*dt);
    r+=dt/6*(k1r+2*k2r+2*k3r+k4r); v+=dt/6*(k1v+2*k2v+2*k3v+k4v); t+=dt;
    ts.push(t); rs.push(r); vs.push(v);
  }
  const n=ts.length-1, f=(rEnd-rs[n-1])/(rs[n]-rs[n-1]);
  ts[n]=ts[n-1]+f*dt; rs[n]=rEnd; vs[n]=lerp(vs[n-1],vs[n],f);
  let vmin=1e9; for(const x of vs) vmin=Math.min(vmin,x);
  return {ts,rs,vs,dur:ts[n],dt,vmin};
})();
function coastAt(tc){
  const {ts,rs,vs,dt}=COAST; tc=clamp(tc,0,COAST.dur);
  const i=Math.min(Math.floor(tc/dt), ts.length-2);
  const u=clamp((tc-ts[i])/(ts[i+1]-ts[i]),0,1);
  return [lerp(rs[i],rs[i+1],u), lerp(vs[i],vs[i+1],u)];
}
function coastTimeAtR(rq){const {ts,rs}=COAST;for(let i=1;i<rs.length;i++) if(rs[i]>=rq) return ts[i-1]+(rq-rs[i-1])/(rs[i]-rs[i-1])*(ts[i]-ts[i-1]);return COAST.dur;}
T.FLYBY=T.SECO2+COAST.dur;
T.EQ=T.SECO2+coastTimeAtR(346000);

function mstate0(t){
  const s={alt:0,v:0,g:1,dr:0,gamma:Math.PI/2,r:RE,phase:'pre',theta:0};
  if(t<0) return s;
  if(t<=T.SECO1){
    const [a,d,v]=ascAt(t); s.alt=a; s.dr=d; s.v=v; s.phase='asc'; s.r=RE+a; s.theta=d/RE;
    const p=ascAt(t-1), n=ascAt(t+1);
    s.gamma = t<15 ? Math.PI/2 : Math.atan2(n[0]-p[0], Math.max(1e-6,n[1]-p[1]));
    const dv=(n[2]-p[2])/2*1000; s.g=Math.max(0,(dv+9.81*Math.sin(s.gamma))/9.81);
    if(t>T.BECO-1&&t<T.SIDESEP) s.g*=.6;
    if(t>T.MECO&&t<T.SES1) s.g=0.05;
    return s;
  }
  const th0=800/RE, w=7.79/(RE+200);
  if(t<T.TLI){ s.alt=200; s.v=7.79; s.g=0; s.gamma=0; s.phase='park'; s.theta=th0+w*(t-T.SECO1); s.r=RE+200; return s; }
  if(t<T.SECO2){ const u=(t-T.TLI)/(T.SECO2-T.TLI); s.v=lerp(7.79,10.92,u); s.alt=lerp(200,207,u); s.g=0.72+0.5*u; s.gamma=0; s.phase='tli'; s.theta=th0+w*(t-T.SECO1); s.r=RE+s.alt; return s; }
  const [r,v]=coastAt(t-T.SECO2); s.r=r; s.alt=r-RE; s.v=v; s.g=0; s.gamma=0;
  s.phase = t>=T.FLYBY-1 ? 'flyby' : 'coast'; s.theta=th0+w*(T.SECO2-T.SECO1);
  return s;
}
function mstate(t){const s=mstate0(t);
  if(EMB.slave&&EMB.tel&&t===S.t&&t>0){s.alt=EMB.tel.alt;s.v=EMB.tel.v;s.g=EMB.tel.g;s.r=RE+s.alt;}
  return s;}
const PHASE={pre:'Prelanzamiento',asc:'Ascenso',park:'Órbita de estacionamiento',tli:'Inyección translunar',coast:'Crucero translunar',flyby:'Sobrevuelo lunar'};

function propLevels(t){

  return {rp1,lox1,lox2};
}

const lookBase=(()=>{const f=PANEL_C.clone().sub(camHome).normalize();const r=new THREE.Vector3().crossVectors(f,new THREE.Vector3(0,1,0)).normalize();const u=new THREE.Vector3().crossVectors(r,f);return {f,r,u};})();
function lookDir(yaw,pitch){const {f,r,u}=lookBase;return f.clone().multiplyScalar(Math.cos(yaw)*Math.cos(pitch)).addScaledVector(r,Math.sin(yaw)*Math.cos(pitch)).addScaledVector(u,Math.sin(pitch)).normalize();}
function aimCabinCam(){

  cam.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,y,z));
}
function yawPitchTo(localPoint){
  const d=localPoint.clone().sub(camHome).normalize(); const {f,r,u}=lookBase;
  const p=Math.asin(clamp(d.dot(u),-1,1)); const y=Math.atan2(d.dot(r),d.dot(f)); return [y,p];
}

function earthPos(t,out){
  const s=mstate(t); out.set(0,-1,0);
  if(t>T.SECO2){const b=smooth(0,4*3600,t-T.SECO2);out.lerp(uM.clone().negate(),b).normalize();}

}
function flightQuat(t,out){const s=mstate(t);if(t<0) return out.identity();return out.setFromAxisAngle(new THREE.Vector3(0,0,1),-(Math.PI/2-s.gamma));}

function stepWarp(st){if(st.warp==='user')return S.uwarp;if(st.warp==='coast'){return clamp((T.FLYBY-S.t)/10,15,6000);}return st.warp??1;}
function advance(){
  const st=STEPS[S.step];
  if(st&&(st.k==='event')) S.log.push({t:S.t,n:st.title});
  S.step++; S.ready=false;
  const nx=STEPS[S.step];
  if(nx&&nx.k==='slew'){S.attMode='slew';S.slewT=0;S.slewFrom=new THREE.Quaternion();flightQuat(S.t,S.slewFrom);}
  if(nx&&nx.k==='game'){ G.w={x:0,y:0,z:0}; G.okT=0; }
  setCard();
  if(nx&&nx.ctl&&isHere()) highlightPhysical();
}
function catchUp(){
  if(!S.boarded) return;
  // si el reloj volvió atrás (el usuario movió la línea de tiempo), se rehace la secuencia desde el principio
  let lastAt; for(let i=S.step-1;i>=0;i--) if(STEPS[i].at!==undefined){lastAt=STEPS[i].at;break;}
  if(lastAt!==undefined&&S.t<lastAt-5){S.step=1;for(const f in S.flags)S.flags[f]=false;S.attMode='flight';S.sepT=0;S.ready=false;}
  let k=-1; for(let i=0;i<STEPS.length;i++) if(STEPS[i].at!==undefined&&STEPS[i].at<=S.t-2) k=i;
  if(k<S.step) return;
  const gi=STEPS.findIndex(x=>x.k==='game');
  for(let i=S.step;i<=k;i++){const st=STEPS[i]; if(st.k==='act'&&st.ctl&&st.ctl.startsWith('scr:')) applyEffect(st.ctl);}
  if(S.step<=gi&&k>gi) S.attMode='auto';
  S.step=k; advance();
}
function tick(dt){
  if(!S.boarded) return;
  const st=STEPS[S.step]; if(!st) return;
  S.holding=false;
  if(st.k==='info'){S.holding=true;return;}
  if(st.k==='slew'){
    S.slewT+=dt; const u=smooth(0,st.dur,S.slewT);
    const tq=targetQuat(S.t,new THREE.Quaternion()); const goal=tq.clone().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(-7*D2R,9*D2R,12*D2R,'XYZ')));
    G.q.copy(S.slewFrom).slerp(goal,u); S.t+=dt;
    if(S.slewT>=st.dur){S.attMode='game';advance();}
    return;
  }
  if(st.k==='game'){ S.t+=dt; gameUpdate(dt); return; }
  if(st.at!==undefined && S.t<st.at){ S.t=Math.min(st.at,S.t+dt*stepWarp(st)); return; }
  if(st.k==='event'){ if(st.call) callout(st.call,fmtClock(st.at)); advance(); return; }
  if(st.k==='act'){ if(!S.ready){S.ready=true;setCard();highlightPhysical();beep(660,.06,.05);} S.holding=true; }
}
function gameUpdate(dt){
  const w=G.w; const dq=new THREE.Quaternion().setFromEuler(new THREE.Euler(w.x*D2R*dt,w.y*D2R*dt,w.z*D2R*dt,'XYZ'));
  G.q.multiply(dq).normalize();
  const tq=targetQuat(S.t,new THREE.Quaternion()); const qe=tq.invert().multiply(G.q); const e=new THREE.Euler().setFromQuaternion(qe,'XYZ');
  G.err={x:e.x/D2R,y:e.y/D2R,z:e.z/D2R};
  const ok=Math.abs(G.err.x)<.2&&Math.abs(G.err.y)<.2&&Math.abs(G.err.z)<.2&&Math.abs(w.x)<.2&&Math.abs(w.y)<.2&&Math.abs(w.z)<.2;
  G.okT= ok? G.okT+dt : 0;
  if(G.okT>1.5){ callout('Alineado','La Luna está en la mira'); beep(880,.12,.08); setTimeout(()=>beep(1320,.16,.08),130); advance(); }
}
function isHere(){return S.boarded&&S.view==='cabin';}
function doControl(id){
  const st=STEPS[S.step];
  if(id.startsWith('rot:')){
    if(!st||st.k!=='game') return;
    const [,ax,sg]=id.split(':');
    if(ax==='step'){G.stepSize=G.stepSize>.5?.1:1;beep(520,.05,.05);return;}
    if(ax==='kill'){G.w={x:0,y:0,z:0};beep(420,.08,.05);return;}
    G.w[ax]=Math.round((G.w[ax]+(sg==='+'?1:-1)*G.stepSize)*10)/10; beep(sg==='+'?760:620,.04,.05); return;
  }
  if(st&&st.k==='act'&&st.ctl===id&&S.ready){ applyEffect(id); beep(990,.07,.07); S.log.push({t:S.t,n:st.title}); advance(); return; }
  if(st&&st.k==='act'&&st.ctl===id&&!S.ready){ toast('Todavía no: espera a que el reloj llegue a '+fmtClock(st.at)+'.'); return; }
  beep(220,.12,.05); toast('Ese no es el siguiente paso. Sigue la tarjeta del tutorial (puedes tocar «Mostrar dónde»).');
}
function applyEffect(id){
  const F=S.flags;
  switch(id){
    case 'scr:suit':F.suits=true;break; case 'scr:prop':F.prop=true;break; case 'scr:arm':F.arm=true;break;
    case 'scr:les':F.les=true;break; case 'scr:power':F.power=true;break; case 'scr:go':F.go=true;break; case 'scr:tli':F.tli=true;break;
    case 'scr:sep':F.sep=true;S.sepT=S.t;break; case 'scr:nose':F.nose=true;break; case 'scr:manual':F.manual=true;break;
    case 'scr:auto':F.auto=true;S.attMode='auto';break;

}

function targetLocal(st){

  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,Q.high?2:1.25)); resize();
  bloom.enabled=Q.high;
  for(const l of[sunLight,sunG]){const n=Q.high?2048:1024;if(l.shadow.mapSize.x!==n){l.shadow.mapSize.set(n,n);if(l.shadow.map){l.shadow.map.dispose();l.shadow.map=null;}}}
  $('#bQual').textContent='Calidad: '+(Q.high?'alta':'media');
}
$('#bQual').addEventListener('click',()=>{Q.high=!Q.high;applyQuality();});
applyQuality();
const clock=new THREE.Clock(); let screenAcc=0;
function frame(){
  const dt=Math.min(clock.getDelta(),.1); NOW+=dt;
  if(EMB.slave){ if(EMB.playing) EMB.t+=dt*EMB.rate; S.t=EMB.t; catchUp(); const tk=S.t; tick(dt); S.t=tk; S.lastWarp=EMB.playing?EMB.rate:0; }
  else { const t0=S.t; tick(dt); S.lastWarp=dt>0?(S.t-t0)/dt:1; }
  updateGround(dt); updateGroundCam(dt); updateSpace(dt); audioUpdate(); hud(dt);
  const useGround=!S.boarded||(S.view==='ext'&&S.t<T.SES1);
  cabin.visible=!useGround&&S.view==='cabin'; extModel.visible=!useGround&&S.view==='ext';
  if(EMB.hidden){ requestAnimationFrame(frame); return; }
  if(isCabinView()){ screenAcc+=dt; if(screenAcc>1/20){screenAcc=0;drawLeft();drawCenter();drawRight();} }
  const tag=$('#tag3d');
  if(!S.boarded&&!S.boarding){const p=fh.userData.dragon.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(2.2,2.5,0)).project(gcam);
    tag.hidden=p.z>1; tag.style.left=((p.x+1)/2*innerWidth)+'px'; tag.style.top=((1-p.y)/2*innerHeight)+'px';}
  rpGround.enabled=useGround; rpFar.enabled=rpNear.enabled=!useGround;
  if(!useGround){ const c=S.view==='cabin'?cam:ecam; rpNear.camera=c; near.updateMatrixWorld(); c.updateMatrixWorld(); c.getWorldPosition(fcam.position); c.getWorldQuaternion(fcam.quaternion); fcam.fov=c.fov; fcam.aspect=innerWidth/innerHeight; fcam.updateProjectionMatrix(); }
  renderer.toneMappingExposure= useGround ? .5 : (S.view==='cabin' ? 1.2 : .85);
  bloom.strength= useGround ? .5 : (S.view==='cabin' ? .12 : .4); bloom.threshold= S.view==='cabin'&&!useGround ? 1.2 : .92;
  grade.uniforms.time.value=NOW;
  composer.render(dt);
  requestAnimationFrame(frame);
}
setCard(); drawLeft(); drawCenter(); drawRight();
$('#loading').remove();
if(EMB.on){
  $('#bReset').hidden=true;
  addEventListener('message',e=>{const d=e.data; if(!d||d.src!=='puerto'||d.type!=='sync') return;
    EMB.hidden=!!d.hidden; EMB.tel=d.tel||null; EMB.rate=d.rate||1; EMB.playing=!!d.playing;
    if(d.mode==='slave'){ EMB.t=d.t; if(!EMB.slave){EMB.slave=true;S.t=d.t;} } else EMB.slave=false;
    if(d.board&&!S.boarded) board();
  });
  setInterval(()=>{try{parent.postMessage({src:'dragon',type:'state',t:S.t,holding:S.holding,boarded:S.boarded},'*');}catch(e){}},100);
  setTimeout(()=>{if(!S.boarded) board();},250);
}
requestAnimationFrame(frame);
</script>
